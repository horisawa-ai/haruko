<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Curso de Inglês da Haruko 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;--surface:#FFFFFF;--surface-2:#FFFBF4;
  --ink:#231F1A;--ink-soft:#6E665A;--ink-faint:#A89E8E;
  --primary:#E0654A;--primary-dark:#C44E36;--primary-soft:#FBE6DF;
  --accent:#1F9A86;--accent-soft:#E2F2EE;--gold:#E5A93A;
  --correct:#2E9E5B;--correct-bg:#E7F6EC;--wrong:#D6453F;--wrong-bg:#FBEAE9;
  --line:#EFE6D7;
  --shadow:0 2px 4px rgba(60,40,20,.04),0 8px 24px rgba(60,40,20,.07);
  --shadow-lg:0 4px 8px rgba(60,40,20,.06),0 18px 44px rgba(60,40,20,.12);
  --r:20px;--r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:19px;}
html,body{margin:0;padding:0;}
body{font-family:"Hanken Grotesk",-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 85% 0%,rgba(224,101,74,.07),transparent 60%),
             radial-gradient(55% 45% at 5% 100%,rgba(31,154,134,.06),transparent 60%);}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;line-height:1.08;margin:0;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;
  background:linear-gradient(var(--bg) 78%,rgba(251,246,238,0));backdrop-filter:blur(2px);}
.back{width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;flex:0 0 auto;
  background:var(--surface);box-shadow:var(--shadow);color:var(--ink);transition:transform .15s;}
.back:active{transform:scale(.92);}.back svg{width:20px;height:20px;}
.topbar.has-back .back{display:flex;}
.bar-title{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.02rem;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
.slow-toggle{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--surface);box-shadow:var(--shadow);
  padding:8px 13px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--ink-soft);transition:transform .15s;}
.slow-toggle:active{transform:scale(.95);}.slow-toggle.on{background:var(--primary);color:#fff;}
.slow-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}.slow-toggle.on .dot{background:#fff;}
.pbar-wrap{padding:0 18px 6px;}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#EF8B5F);border-radius:99px;
  transition:width .6s cubic-bezier(.2,.8,.2,1);}
.screen{flex:1;padding:6px 18px 128px;}

.hero-tag{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);
  font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:99px;margin-bottom:14px;}
.hero h1{font-size:2.05rem;font-weight:800;margin-bottom:10px;}.hero h1 .accent{color:var(--primary);}
.cando{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:18px 0 22px;
  border:1px solid var(--line);position:relative;overflow:hidden;}
.cando::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold);}
.cando .k{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.cando p{margin:0;color:var(--ink);font-weight:500;font-size:1.02rem;line-height:1.45;}.cando b{color:var(--primary);font-weight:700;}
.section-label{font-size:.82rem;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin:6px 4px 12px;}

/* chapter cards (course home) */
.ch-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;}
.ch-card:active{transform:scale(.985);box-shadow:var(--shadow-lg);}
.ch-card.locked,.ch-card.soon{opacity:.62;}
.ch-num{width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:"Bricolage Grotesque";font-weight:800;font-size:1.25rem;background:var(--primary-soft);color:var(--primary-dark);}
.ch-card.done .ch-num{background:var(--correct);color:#fff;}
.ch-card.locked .ch-num,.ch-card.soon .ch-num{background:var(--line);color:var(--ink-faint);}
.ch-body{flex:1;min-width:0;}.ch-body .t{display:block;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.12rem;color:var(--ink);line-height:1.22;}
.ch-body .s{display:block;font-size:.92rem;color:var(--ink-soft);margin-top:4px;line-height:1.32;}
.ch-mark{flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.ch-mark .circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);color:transparent;}
.ch-mark .circle.done{background:var(--correct);border-color:var(--correct);color:#fff;}
.ch-mark .circle.lock{border:none;color:var(--ink-faint);}
.ch-mark svg{width:16px;height:16px;}
.ch-mark .pill{font-size:.72rem;font-weight:700;color:var(--ink-faint);background:var(--bg);padding:5px 9px;border-radius:99px;
  border:1px solid var(--line);}

.lesson-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;}
.lesson-card:active{transform:scale(.985);box-shadow:var(--shadow-lg);}
.lc-ico{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;background:var(--primary-soft);}
.lc-body{flex:1;min-width:0;}.lc-body .t{display:block;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.12rem;color:var(--ink);line-height:1.22;}
.lc-body .s{display:block;font-size:.92rem;color:var(--ink-soft);margin-top:4px;line-height:1.32;}
.lc-mark{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);color:transparent;transition:.2s;}
.lc-mark.done{background:var(--correct);border-color:var(--correct);color:#fff;}.lc-mark svg{width:16px;height:16px;}

.done-banner{display:flex;align-items:center;gap:12px;background:var(--correct-bg);border:1px solid #BFE6CC;
  border-radius:var(--r);padding:14px 16px;margin:0 0 18px;}
.done-banner .ic{width:34px;height:34px;border-radius:50%;background:var(--correct);color:#fff;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;}
.done-banner .ic svg{width:18px;height:18px;}
.done-banner .tx{font-weight:700;color:#1d6e40;font-size:.96rem;}

.lead{color:var(--ink-soft);font-size:1.02rem;margin:2px 0 20px;line-height:1.5;}
h2.title{font-size:1.7rem;font-weight:800;margin-bottom:4px;}
.group-head{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.2rem;color:var(--primary);
  margin:26px 2px 13px;display:flex;align-items:center;gap:9px;}
.group-head .em{font-size:1.3rem;}.group-head:first-of-type{margin-top:8px;}

.spk{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;flex:0 0 auto;
  background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(224,101,74,.35);transition:transform .12s;}
.spk:active{transform:scale(.88);}.spk.sm{width:44px;height:44px;}
.spk svg{width:23px;height:23px;}.spk.sm svg{width:20px;height:20px;}
.spk.ghost{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,101,74,.45);}100%{box-shadow:0 0 0 16px rgba(224,101,74,0);}}
.spk.playing{animation:ring .6s ease-out;}

.alpha{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:6px 0 26px;}
.alpha button{aspect-ratio:1;border-radius:13px;background:var(--surface);border:1px solid var(--line);
  font-family:"Bricolage Grotesque";font-weight:700;font-size:1.5rem;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .12s,background .12s,color .12s;display:flex;align-items:center;justify-content:center;}
.alpha button:active{transform:scale(.9);background:var(--primary);color:#fff;}

.num-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 26px;}
.num-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 6px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s,background .12s;}
.num-tile:active{transform:scale(.93);background:var(--primary);}
.num-tile .d{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.45rem;color:var(--primary);}
.num-tile:active .d{color:#fff;}
.num-tile .w{font-size:.8rem;color:var(--ink-soft);font-weight:600;text-align:center;}.num-tile:active .w{color:#fff;}

.sound-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);}
.sound-card .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.45rem;color:var(--primary);flex:0 0 auto;min-width:42px;}
.sound-card .info{flex:1;min-width:0;}.sound-card .info .w{font-weight:700;color:var(--ink);}
.sound-card .info .d{font-size:.86rem;color:var(--ink-soft);margin-top:1px;}

.vocab-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.vc-emoji{font-size:1.7rem;flex:0 0 auto;width:38px;text-align:center;}
.vc-text{flex:1;min-width:0;}.vc-en{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.13rem;color:var(--ink);}
.vc-pt{font-size:.92rem;color:var(--accent);font-weight:600;margin-top:1px;}
.vc-ex{font-size:.82rem;color:var(--ink-faint);margin-top:3px;font-style:italic;}

.use-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:13px;box-shadow:var(--shadow);}
.use-card.warn{background:linear-gradient(var(--surface-2),var(--surface));border-color:#F2D9B8;}
.use-card h3{font-size:1.12rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.use-card h3 .emj{font-size:1.2rem;}
.use-card p{margin:0;color:var(--ink-soft);font-size:.97rem;line-height:1.55;}.use-card p+p{margin-top:8px;}
.use-card .en{font-weight:700;color:var(--primary);font-style:normal;}.use-card .en2{font-weight:700;color:var(--accent);}
.gtable{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.gtable .row{display:flex;border-bottom:1px solid var(--line);}
.gtable .row:last-child{border-bottom:none;}
.gtable .row>div{flex:1;padding:9px 11px;font-size:.92rem;}
.gtable .row>div:first-child{font-weight:700;color:var(--primary);background:var(--surface-2);flex:0 0 42%;}
.gtable .row .pt{color:var(--ink-faint);font-size:.82rem;}

.dlg-block{margin-bottom:30px;}
.dlg-title{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.18rem;margin-bottom:12px;display:flex;align-items:center;gap:9px;}
.dlg-title .em{font-size:1.25rem;}
.play-all{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--ink);color:#fff;
  border-radius:var(--r-sm);padding:13px;font-weight:700;font-size:.98rem;margin-bottom:13px;box-shadow:var(--shadow);transition:transform .12s;}
.play-all:active{transform:scale(.98);}.play-all svg{width:19px;height:19px;}
.line{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);transition:.2s;}
.line.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft),var(--shadow);}
.line .who{font-weight:700;font-size:.76rem;color:var(--primary);flex:0 0 auto;width:58px;padding-top:9px;}
.line .ct{flex:1;min-width:0;}.line .en{font-weight:600;color:var(--ink);font-size:1.04rem;}
.line .pt{font-size:.87rem;color:var(--ink-faint);margin-top:2px;}
.dialogue.hide-pt .pt{display:none;}
.pt-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:2px 0 4px;
  color:var(--ink-soft);font-weight:600;font-size:.9rem;padding:11px;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);}

.ex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ex-count{font-size:.84rem;font-weight:700;color:var(--ink-faint);letter-spacing:.04em;}
.ex-dots{display:flex;gap:4px;flex-wrap:wrap;max-width:62%;justify-content:flex-end;}
.ex-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.3s;}
.ex-dots i.on{background:var(--primary);}.ex-dots i.done{background:var(--correct);}
.q-prompt{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.38rem;margin:14px 0 4px;line-height:1.22;}
.q-sub{color:var(--ink-soft);font-size:.95rem;margin-bottom:18px;}
.q-audio-hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 22px;}
.q-audio-hero .big-spk{width:104px;height:104px;border-radius:50%;background:var(--primary);color:#fff;display:flex;
  align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(224,101,74,.4);transition:transform .12s;}
.q-audio-hero .big-spk:active{transform:scale(.92);}.q-audio-hero .big-spk svg{width:42px;height:42px;}
.q-audio-hero .hint{font-size:.85rem;color:var(--ink-faint);font-weight:600;}

.opts{display:flex;flex-direction:column;gap:11px;}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:15px 16px;text-align:left;font-size:1.06rem;font-weight:600;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .12s,border-color .15s,background .15s;width:100%;}
.opt:active{transform:scale(.985);}
.opt .key{width:26px;height:26px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;color:var(--ink-soft);flex:0 0 auto;}
.opt.correct{border-color:var(--correct);background:var(--correct-bg);}.opt.correct .key{background:var(--correct);color:#fff;}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);}.opt.wrong .key{background:var(--wrong);color:#fff;}
.opt.dim{opacity:.5;}.opt[disabled]{cursor:default;}

.answer-row{min-height:62px;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;background:var(--surface-2);
  border:2px dashed var(--line);border-radius:var(--r-sm);padding:13px;margin-bottom:16px;}
.answer-row.ok{border-color:var(--correct);border-style:solid;background:var(--correct-bg);}
.answer-row.bad{border-color:var(--wrong);border-style:solid;background:var(--wrong-bg);}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:8px;}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:11px 16px;font-weight:700;
  font-size:1.06rem;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s;}
.tile:active{transform:scale(.92);}.tile.placed{background:var(--primary);color:#fff;border-color:var(--primary);}
.tile.used{visibility:hidden;}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.match-col{display:flex;flex-direction:column;gap:11px;}
.mtile{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-sm);padding:14px 10px;font-weight:700;
  font-size:1.02rem;color:var(--ink);box-shadow:var(--shadow);transition:.15s;text-align:center;}
.mtile:active{transform:scale(.96);}.mtile.sel{border-color:var(--primary);background:var(--primary-soft);}
.mtile.matched{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);opacity:.7;pointer-events:none;}
.mtile.miss{border-color:var(--wrong);background:var(--wrong-bg);}

.spacer{height:8px;}
.footer-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(251,246,238,0),var(--bg) 30%);}
.footer-inner{max-width:520px;margin:0 auto;}
.feedback{border-radius:var(--r-sm);padding:13px 15px;margin-bottom:11px;display:flex;gap:10px;align-items:flex-start;
  font-weight:600;animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.feedback.good{background:var(--correct-bg);color:#1d6e40;}.feedback.bad{background:var(--wrong-bg);color:#9c2b27;}
.feedback .fi{font-size:1.2rem;line-height:1.2;}.feedback .ft{flex:1;font-size:.95rem;line-height:1.4;}.feedback .ft b{font-weight:800;}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--primary);color:#fff;
  border-radius:var(--r-sm);padding:17px;font-weight:800;font-size:1.08rem;box-shadow:0 6px 18px rgba(224,101,74,.32);transition:transform .12s,opacity .15s;}
.btn:active{transform:scale(.98);}.btn.dark{background:var(--ink);box-shadow:var(--shadow-lg);}
.btn.ghost{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);}
.btn[disabled]{opacity:.45;pointer-events:none;}.btn svg{width:20px;height:20px;}
.check-btn{width:100%;background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:15px;font-weight:800;font-size:1.04rem;
  box-shadow:var(--shadow);transition:transform .12s;}
.check-btn:active{transform:scale(.98);}.check-btn[disabled]{opacity:.4;pointer-events:none;}

.result{text-align:center;padding-top:28px;}
.trophy{font-size:4.6rem;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);}100%{transform:scale(1) rotate(0);}}
.result h1{font-size:2rem;font-weight:800;margin:10px 0 6px;}
.result .score{font-family:"Bricolage Grotesque";font-weight:800;font-size:3.6rem;color:var(--primary);margin:10px 0;}
.result p{color:var(--ink-soft);font-size:1.05rem;margin:0 0 24px;line-height:1.5;}.result .score.pass{color:var(--correct);}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:50;border-radius:2px;pointer-events:none;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2;}}
.reveal{opacity:0;animation:rise .5s ease forwards;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.muted-note{font-size:.82rem;color:var(--ink-faint);text-align:center;margin-top:18px;line-height:1.5;padding:0 8px;}
.reset-zone{margin:34px 0 6px;padding-top:22px;border-top:1px solid var(--line);}
.reset-btn{display:block;margin:0 auto;color:var(--ink-faint);font-weight:600;font-size:.92rem;padding:11px 18px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);transition:transform .12s;}
.reset-btn:active{transform:scale(.96);}
.reset-warn{background:var(--wrong-bg);border:1px solid #F2C4C2;border-radius:var(--r);padding:18px;animation:slideUp .25s ease;}
.reset-warn p{margin:0 0 14px;color:#9c2b27;font-weight:600;font-size:1rem;line-height:1.45;}
.btn-danger{width:100%;background:var(--wrong);color:#fff;border-radius:var(--r-sm);padding:15px;font-weight:800;font-size:1.04rem;box-shadow:0 6px 16px rgba(214,69,63,.3);transition:transform .12s;margin-bottom:10px;}
.btn-danger:active{transform:scale(.98);}

/* ===== AUDIO ENGINE ===== */
let VOICE=null,slowMode=false,warmed=false;
function pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();
  VOICE=v.find(x=>x.lang==='en-US'&&/samantha|aaron|nicky|natural|google us/i.test(x.name))
     ||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'))||null;}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,opts){opts=opts||{};if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  if(!warmed){try{const w=new SpeechSynthesisUtterance(' ');w.volume=0;speechSynthesis.speak(w);}catch(e){}warmed=true;}
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(VOICE)u.voice=VOICE;
  u.rate=opts.slow?0.55:(slowMode?0.72:0.92);u.pitch=1;u.volume=1;speechSynthesis.speak(u);}
function ring(node){if(!node)return;node.classList.remove('playing');void node.offsetWidth;node.classList.add('playing');}

 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"a/an, the, this/that e plural",
   title:"Artigos, demonstrativos e plural",intro:"Quatro ferramentas pequenas que aparecem em toda frase.",
   data:[
    {emj:"🅰️",title:"a ou an? (um/uma)",html:'Use <span class="en">a</span> antes de som de consoante (<span class="en2">a book</span>, <span class="en2">a car</span>) e <span class="en">an</span> antes de som de vogal (<span class="en2">an apple</span>, <span class="en2">an egg</span>, <span class="en2">an hour</span>). É pelo SOM, não pela letra.'},
    {emj:"🔵",title:"the (o/a/os/as)",html:'<span class="en">the</span> é o artigo definido — aquele específico que os dois já conhecem: <span class="en2">the door</span> (a porta), <span class="en2">the car</span> (o carro). Serve para singular e plural.'},
    {emj:"👇",title:"this / that / these / those",html:'Perto x longe, singular x plural:',table:[["this","isto/este (perto)","singular"],["that","aquilo/aquele (longe)","singular"],["these","estes (perto)","plural"],["those","aqueles (longe)","plural"]]},
    {emj:"➕",title:"Plural: geralmente +s",html:'<span class="en2">book → books</span>. Depois de s, x, ch, sh, vem <span class="en">-es</span> (<span class="en2">box → boxes</span>). Consoante + y vira <span class="en">-ies</span> (<span class="en2">city → cities</span>).'},
    {warn:true,emj:"🌀",title:"Plurais irregulares",html:'Alguns mudam tudo — decore: <span class="en2">man → men</span>, <span class="en2">woman → women</span>, <span class="en2">child → children</span>, <span class="en2">foot → feet</span>, <span class="en2">person → people</span>.'}

   data:[

    {emj:"📍",title:"O ’s de posse",html:'Para dizer “de alguém”, acrescente <span class="en">’s</span> ao nome: <span class="en2">Maria’s mother</span> (a mãe da Maria), <span class="en2">my father’s car</span> (o carro do meu pai). É ao contrário da ordem do português.'},
    {warn:true,emj:"🚻",title:"his x her — é de quem POSSUI",html:'Não muda com o objeto, e sim com o DONO. <span class="en2">his name</span> = o nome DELE; <span class="en2">her name</span> = o nome DELA — mesmo que “name” não tenha gênero.'},
    {emj:"❓",title:"Perguntar quem é",html:'<span class="en">Who is he?</span> (quem é ele?) → <span class="en2">He’s my brother.</span> <span class="en">Who is she?</span> → <span class="en2">She’s my sister.</span>'}

   data:[
    {emj:"🔁",title:"Para rotinas e hábitos",html:'Para o que é sempre/normal: <span class="en2">I work in a hospital.</span> (eu trabalho num hospital), <span class="en2">We live in Brazil.</span> (nós moramos no Brasil).'},

    {emj:"➖",title:"Negativo: don’t / doesn’t",html:'Use <span class="en">don’t</span> (I/you/we/they) e <span class="en">doesn’t</span> (he/she/it) + verbo na forma base: <span class="en2">I don’t eat meat.</span> <span class="en2">He doesn’t work here.</span> (repare: tira o -s do verbo!).'},
    {emj:"❓",title:"Pergunta: Do / Does",html:'Comece com <span class="en">Do</span> ou <span class="en">Does</span>: <span class="en2">Do you speak English?</span> <span class="en2">Does she live here?</span> Resposta curta: <span class="en2">Yes, I do.</span> / <span class="en2">No, she doesn’t.</span>'}

{id:"ch10",n:10,title:"Can / can't — habilidade e pedidos",sub:"Dizer o que consegue e fazer pedidos",

 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"can, can't e pedidos",
   title:"O verbo can",intro:"Um verbinho que serve para habilidade (saber fazer), permissão (poder) e pedidos. E ele é bem fácil.",
   data:[
    {emj:"💪",title:"can = conseguir / saber / poder",html:'<span class="en">can</span> + verbo na forma base: <span class="en2">I can swim.</span> (sei nadar), <span class="en2">She can drive.</span> (ela sabe dirigir).'},
    {warn:true,emj:"🚫",title:"can NÃO muda no he/she",html:'Diferente dos outros verbos, <span class="en">can</span> não ganha -s: <span class="en2">He can cook</span> (não “he cans”). E o verbo depois fica na forma base — sem -ing, sem -s.'},
    {emj:"➖",title:"can’t = não consegue / não pode",html:'O negativo é <span class="en">can’t</span> (de cannot): <span class="en2">I can’t swim.</span> (não sei nadar), <span class="en2">He can’t come today.</span>'},
    {emj:"🙏",title:"Pedidos e permissão",html:'<span class="en2">Can you help me?</span> (pode me ajudar?), <span class="en2">Can I have a coffee?</span> (pode me ver um café?), <span class="en2">Can I go?</span> (posso ir?).'}

{id:"ch13",n:13,title:"Present continuous",sub:"O que está acontecendo agora",
 goal:"dizer o que você <b>está fazendo neste momento</b> e entender a diferença com o que faz <i>todo dia</i>",
 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"be + -ing e as regras de spelling",
   title:"O que está acontecendo agora",intro:"Enquanto o present simple fala de hábitos (todo dia), o present continuous fala do que está rolando AGORA.",
   data:[
    {emj:"🔑",title:"A fórmula: be + verb + -ing",html:'Simples: sujeito + <span class="en">am/is/are</span> + verbo com -ing.',table:[["I am eating","eu estou comendo","I'm eating."],["he/she/it is working","ele/ela está trabalhando","She's working."],["you/we/they are playing","vocês/nós/eles estão jogando","They're playing."]]},
    {warn:true,emj:"✏️",title:"Regras do -ing (cuidado!)",html:'Maioria é só <span class="en">+ing</span>: <span class="en2">eat → eating</span>. Mas: verbo com <b>e mudo</b> no fim → tira o e: <span class="en2">make → making</span>, <span class="en2">write → writing</span>. Consoante curta + vogal + consoante → dobra: <span class="en2">sit → sitting</span>, <span class="en2">run → running</span>.'},
    {emj:"➖",title:"Negativo: be + not + -ing",html:'<span class="en2">I\u2019m not sleeping.</span> (não estou dormindo), <span class="en2">She isn\u2019t working.</span> (ela não está trabalhando), <span class="en2">They aren\u2019t playing.</span> (eles não estão jogando).'},
    {emj:"❓",title:"Pergunta: be antes do sujeito",html:'<span class="en2">Are you studying?</span> <span class="en2">Is she cooking?</span> <span class="en2">What are you doing?</span> Resposta curta: <span class="en2">Yes, I am.</span> / <span class="en2">No, she isn\u2019t.</span>'},
    {warn:true,emj:"⚡",title:"Agora x todo dia",html:'<span class="en">Present simple</span> = hábito: <span class="en2">I eat rice every day.</span> <span class="en">Present continuous</span> = agora: <span class="en2">I\u2019m eating rice right now.</span> Não misture os dois!'}
   ]},
  {type:"vocab",icon:"💬",label:"Vocabulário",desc:"Verbos no -ing e marcadores de tempo",
   title:"Verbos em ação",intro:"Ações que se faz agora + as palavras que indicam o momento presente. Toque e ouça.",
   groups:[
    {title:"Verbos no -ing",emj:"🏃",items:[
     {e:"eating",p:"comendo",x:"I'm eating.",em:"🍽️"},

{id:"ch15",n:15,title:"Past simple — verbos regulares",sub:"O passado com -ed",
 goal:"falar do que você <b>fez</b> no passado usando o <b>-ed</b> dos verbos regulares",
 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"O -ed, negativo com didn't e perguntas",
   title:"O passado dos verbos regulares",intro:"A maioria dos verbos no passado é simples: só adicionar -ed. Mas há truques de spelling que o brasileiro pega errado.",
   data:[
    {emj:"🔑",title:"Regra geral: verbo + -ed",html:'<span class="en2">work → worked</span>, <span class="en2">watch → watched</span>, <span class="en2">play → played</span>, <span class="en2">visit → visited</span>. Serve para TODAS as pessoas — sem -s, sem variação. <span class="en2">She worked. I worked. They worked.</span>'},
    {warn:true,emj:"✏️",title:"Cuidado com o spelling",html:'Verbo termina em <b>e</b> → só +d: <span class="en2">like → liked</span>, <span class="en2">live → lived</span>. Verbo curto (CVC) → dobra a consoante: <span class="en2">stop → stopped</span>. Consoante + y → ied: <span class="en2">study → studied</span>, <span class="en2">carry → carried</span>.'},
    {emj:"➖",title:"Negativo: didn't + verbo base",html:'<span class="en">didn\u2019t</span> serve para todas as pessoas. O verbo volta à forma base (sem -ed): <span class="en2">I didn\u2019t work.</span> <span class="en2">She didn\u2019t study.</span> <span class="en2">They didn\u2019t finish.</span>'},
    {emj:"❓",title:"Pergunta: Did + sujeito + verbo base",html:'<span class="en2">Did you call?</span> <span class="en2">Did she cook?</span> O verbo fica na base: <span class="en2">Did he worked?</span> ❌ → <span class="en2">Did he work?</span> ✅. Respostas: <span class="en2">Yes, I did.</span> / <span class="en2">No, she didn\u2019t.</span>'},
    {warn:true,emj:"🚫",title:"Nunca \"did + -ed\" em frase normal",html:'Na afirmativa simples, <span class="en">did</span> não aparece: <span class="en2">She worked.</span> ✅ (não "She did worked"). O <span class="en">did</span> só aparece na negativa e na pergunta.'}
   ]},

{id:"ch16",n:16,title:"Past simple — verbos irregulares",sub:"Os verbos que fogem do -ed",
 goal:"usar os <b>20 verbos irregulares</b> mais usados no passado — aqueles que <i>não</i> seguem o -ed",
 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"Irregulares, didn't e Did",
   title:"Os verbos que mudam tudo",intro:"São os verbos mais usados do inglês — e justamente por isso são irregulares. Não existe atalho: é decorar.",
   data:[
    {emj:"📋",title:"Os irregulares mais importantes",html:'Cada um tem sua forma própria no passado:',table:[["go → went","ir → foi"],["have → had","ter → teve"],["see → saw","ver → viu"],["eat → ate","comer → comeu"],["drink → drank","beber → bebeu"],["get → got","pegar/receber → pegou"],["take → took","pegar/levar → pegou"],["make → made","fazer → fez"],["come → came","vir → veio"],["do → did","fazer → fez"]]},
    {emj:"📋",title:"Mais irregulares essenciais",html:'Grupo 2 — igualmente frequentes no dia a dia:',table:[["say → said","dizer → disse"],["give → gave","dar → deu"],["know → knew","saber → soube"],["think → thought","pensar → pensou"],["feel → felt","sentir → sentiu"],["leave → left","sair/deixar → saiu"],["buy → bought","comprar → comprou"],["find → found","achar → achou"],["sleep → slept","dormir → dormiu"],["write → wrote","escrever → escreveu"]]},
    {emj:"➖",title:"Negativo e pergunta: igual ao regular",html:'Mesmo com verbos irregulares, usa-se <span class="en">didn\u2019t</span> + verbo BASE (não o irregular!): <span class="en2">I didn\u2019t go.</span> <span class="en2">She didn\u2019t have time.</span> Pergunta: <span class="en2">Did you go?</span> <span class="en2">Did she eat?</span>'},
    {warn:true,emj:"🚫",title:"NUNCA: didn't + forma irregular",html:'O erro mais clássico: <span class="en2">I didn\u2019t went.</span> ❌ / <span class="en2">Did she ate?</span> ❌. Com <span class="en">didn\u2019t</span> e <span class="en">did</span>, o verbo SEMPRE fica na forma BASE: <span class="en2">I didn\u2019t go.</span> ✅ / <span class="en2">Did she eat?</span> ✅.'}
   ]},

{id:"ch17",n:17,title:"Future — going to & will",sub:"Planos, intenções e previsões",
 goal:"usar <b>going to</b> para planos e <b>will</b> para decisões e previsões",
 vocab:[
  {e:"plan",p:"plano / planejar"},{e:"trip",p:"viagem"},{e:"next week",p:"semana que vem"},
  {e:"next year",p:"ano que vem"},{e:"tonight",p:"hoje à noite"},{e:"tomorrow",p:"amanhã"},
  {e:"soon",p:"em breve"},{e:"probably",p:"provavelmente"},{e:"maybe",p:"talvez"},
  {e:"definitely",p:"com certeza"},{e:"buy",p:"comprar"},{e:"visit",p:"visitar"},
  {e:"travel",p:"viajar"},{e:"study",p:"estudar"},{e:"move",p:"se mudar"},
  {e:"start",p:"começar"},{e:"finish",p:"terminar"},{e:"help",p:"ajudar"},
  {e:"call",p:"ligar"},{e:"meet",p:"encontrar"},{e:"rain",p:"chover"},
  {e:"snow",p:"nevar"},{e:"bring",p:"trazer"},{e:"take",p:"levar"},
  {e:"leave",p:"sair / partir"},{e:"arrive",p:"chegar"},{e:"open",p:"abrir"},

 ],
 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"going to vs will",
   title:"Dois jeitos de falar do futuro",
   intro:"Em inglês há duas formas principais de falar de coisas que ainda não aconteceram. Cada uma tem seu uso certo.",
   data:[
    {emj:"📅",title:"Going to — planos e intenções",
     html:'Use <span class="en">going to</span> quando o plano já foi decidido antes de falar:',
     table:[["I am going to travel.","Eu vou viajar."],["She is going to study.","Ela vai estudar."],["They are going to move.","Eles vão se mudar."]]},
    {emj:"⚡",title:"Will — decisão na hora / previsão",
     html:'Use <span class="en">will</span> para decisões espontâneas, ofertas e previsões:',
     table:[["I will help you.","Eu vou te ajudar. (decidi agora)"],["It will rain tomorrow.","Vai chover amanhã. (previsão)"],["I'll call you later.","Te ligo mais tarde."]]},
    {emj:"📋",title:"Formas — going to",
     html:'<span class="en">am/is/are + going to + verbo base</span>:',
     table:[["I","am going to buy","vou comprar"],["he / she / it","is going to visit","vai visitar"],["you / we / they","are going to travel","vão viajar"]]},
    {emj:"📋",title:"Formas — will",
     html:'<span class="en">will + verbo base</span> (mesma forma para todos):',
     table:[["I / you / he / she","will come","vai vir"],["we / they","will start","vão começar"],["Contração","'ll","I'll, she'll, they'll"]]},
    {emj:"➖",title:"Negativo",
     html:'<span class="en">Going to</span>: <span class="en2">I am not going to go.</span> / <span class="en2">She isn\u2019t going to call.</span><br><span class="en">Will</span>: <span class="en2">I won\u2019t go.</span> / <span class="en2">She won\u2019t call.</span> (<span class="en">won\u2019t</span> = will not)'},
    {emj:"❓",title:"Pergunta",
     html:'<span class="en">Going to</span>: <span class="en2">Are you going to travel?</span> / <span class="en2">Is she going to study?</span><br><span class="en">Will</span>: <span class="en2">Will you help me?</span> / <span class="en2">Will it rain?</span>'},
    {warn:true,emj:"⚠️",title:"Going to vs Will — a diferença prática",
     html:'<span class="en2">I\u2019m going to buy a car.</span> = já decidi antes (plano). <span class="en2">OK, I\u2019ll pay for the coffee.</span> = decidi agora (espontâneo). Na conversa informal, ambos aparecem, mas a distinção é importante.'}
   ]},
  {type:"vocab",icon:"💬",label:"Vocabulário",desc:"30 palavras do futuro"},
  {type:"dialogue",icon:"🎧",label:"Diálogos",desc:"Planos e previsões",
   data:[
    {emj:"💬",title:"Planos para o fim de semana",
     lines:[
      {who:"A",en:"What are you going to do this weekend?",pt:"O que você vai fazer esse fim de semana?"},
      {who:"B",en:"I'm going to visit my sister.",pt:"Vou visitar minha irmã."},
      {who:"A",en:"That sounds nice. Will she be home?",pt:"Que legal. Ela vai estar em casa?"},
      {who:"B",en:"Yes, she said she'll be there all day.",pt:"Sim, ela disse que vai estar lá o dia todo."},
      {who:"A",en:"I'll probably stay home. Maybe I'll watch a movie.",pt:"Eu provavelmente vou ficar em casa. Talvez eu assista um filme."}
     ]},
    {emj:"💬",title:"Previsão do tempo",
     lines:[
      {who:"A",en:"Is it going to rain tomorrow?",pt:"Vai chover amanhã?"},
      {who:"B",en:"The forecast says it will rain in the afternoon.",pt:"A previsão diz que vai chover à tarde."},
      {who:"A",en:"I'm going to bring an umbrella just in case.",pt:"Vou levar um guarda-chuva, só por precaução."},
      {who:"B",en:"Good idea. I won't forget mine this time.",pt:"Boa ideia. Dessa vez eu não vou esquecer o meu."}
     ]},
    {emj:"💬",title:"Planos de viagem",
     lines:[
      {who:"A",en:"Where are you going to travel next year?",pt:"Para onde você vai viajar no ano que vem?"},
      {who:"B",en:"We're going to go to Europe.",pt:"Vamos para a Europa."},
      {who:"A",en:"Amazing! Will you visit many countries?",pt:"Incrível! Você vai visitar muitos países?"},
      {who:"B",en:"Definitely. We'll start in Portugal.",pt:"Com certeza. Vamos começar em Portugal."},
      {who:"A",en:"I'm going to save money to travel too.",pt:"Vou economizar dinheiro para viajar também."}
     ]}
   ]},

{id:"ch19",n:19,title:"Have to / should / must",sub:"Obrigação, conselho e proibição",
 goal:"expressar <b>obrigação</b> com have to/must, <b>conselho</b> com should e <b>proibição</b> com must not",
 vocab:[
  {e:"rules",p:"regras"},{e:"advice",p:"conselho"},{e:"obligation",p:"obrigação"},
  {e:"wear",p:"usar / vestir"},{e:"pay",p:"pagar"},{e:"arrive",p:"chegar"},
  {e:"practice",p:"praticar"},{e:"rest",p:"descansar"},{e:"sleep",p:"dormir"},
  {e:"exercise",p:"se exercitar"},{e:"eat",p:"comer"},{e:"drink",p:"beber"},
  {e:"follow",p:"seguir"},{e:"obey",p:"obedecer"},{e:"allow",p:"permitir"},
  {e:"permit",p:"permitir"},{e:"forbid",p:"proibir"},{e:"necessary",p:"necessário"},
  {e:"important",p:"importante"},{e:"careful",p:"cuidadoso"},{e:"late",p:"atrasado"},
  {e:"early",p:"cedo"},{e:"on time",p:"no horário"},{e:"healthy",p:"saudável"},
  {e:"sick",p:"doente"},{e:"doctor",p:"médico"},{e:"hospital",p:"hospital"},
  {e:"work",p:"trabalhar"},{e:"study",p:"estudar"},{e:"try",p:"tentar"}
 ],
 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"Have to, should e must",
   title:"Obrigação, conselho e proibição",
   intro:"Inglês usa verbos especiais para expressar o que é obrigatório, o que é recomendado e o que é proibido.",
   data:[
    {emj:"📋",title:"Have to — obrigação externa (regra, necessidade)",
     html:'Use <span class="en">have to</span> quando a obrigação vem de fora (regra, lei, situação):',
     table:[["I have to work tomorrow.","Tenho que trabalhar amanhã."],["She has to wear a uniform.","Ela tem que usar uniforme."],["Do you have to pay?","Você precisa pagar?"]]},
    {emj:"📋",title:"Must — obrigação forte (vem de você mesmo)",
     html:'Use <span class="en">must</span> para obrigação forte, regras formais ou quando a pessoa impõe a regra a si mesma:',
     table:[["You must wear a seatbelt.","Você deve usar cinto."],["I must study more.","Devo estudar mais."],["Passengers must show ID.","Passageiros devem mostrar ID."]]},
    {emj:"💡",title:"Should — conselho / recomendação",
     html:'Use <span class="en">should</span> para dar ou pedir conselho — não é obrigação, é recomendação:',
     table:[["You should rest.","Você deveria descansar."],["She should see a doctor.","Ela deveria ir ao médico."],["Should I call him?","Eu deveria ligar para ele?"]]},
    {emj:"🚫",title:"Must not / Mustn't — proibição",
     html:'<span class="en">Must not</span> (= mustn\u2019t) expressa proibição forte — algo que é PROIBIDO:',
     table:[["You mustn't smoke here.","Você não pode fumar aqui."],["We must not be late.","Não podemos chegar atrasados."],["You mustn't touch that.","Você não pode tocar nisso."]]},
    {emj:"➖",title:"Don't have to — não é necessário (mas pode)",
     html:'<span class="en">Don\u2019t have to</span> = não é obrigado — diferente de proibição!',
     table:[["You don't have to come.","Você não é obrigado a vir."],["She doesn't have to wear a uniform.","Ela não precisa usar uniforme."],["I don't have to work tomorrow.","Não preciso trabalhar amanhã."]]},
    {warn:true,emj:"⚠️",title:"Must not ≠ Don't have to",
     html:'<span class="en2">You must not eat here.</span> = É PROIBIDO comer aqui.<br><span class="en2">You don\u2019t have to eat here.</span> = Não é obrigado a comer aqui (mas pode). Confundir os dois é um erro sério!'}
   ]},
  {type:"vocab",icon:"💬",label:"Vocabulário",desc:"30 palavras de regras e conselhos"},
  {type:"dialogue",icon:"🎧",label:"Diálogos",desc:"Regras e conselhos no dia a dia",
   data:[
    {emj:"💬",title:"Conselho de saúde",
     lines:[
      {who:"A",en:"I'm very tired all the time.",pt:"Estou muito cansada o tempo todo."},
      {who:"B",en:"You should sleep more. How many hours do you sleep?",pt:"Você deveria dormir mais. Quantas horas você dorme?"},
      {who:"A",en:"Only five or six hours. I have to wake up very early.",pt:"Só cinco ou seis horas. Tenho que acordar muito cedo."},
      {who:"B",en:"You must try to sleep at least eight hours. It's important.",pt:"Você deve tentar dormir pelo menos oito horas. É importante."},
      {who:"A",en:"Should I see a doctor?",pt:"Eu deveria ir ao médico?"},
      {who:"B",en:"Yes, you should. Don't wait too long.",pt:"Sim, deveria. Não espere muito tempo."}
     ]},
    {emj:"💬",title:"Regras do trabalho",
     lines:[
      {who:"A",en:"Do I have to wear a uniform at this job?",pt:"Preciso usar uniforme neste trabalho?"},
      {who:"B",en:"Yes, you have to. And you must arrive on time.",pt:"Sim, precisa. E você deve chegar no horário."},
      {who:"A",en:"What about lunch? Do I have to eat here?",pt:"E o almoço? Sou obrigado a comer aqui?"},
      {who:"B",en:"No, you don't have to. But you mustn't be late coming back.",pt:"Não, não é obrigado. Mas você não pode voltar atrasado."}
     ]},
    {emj:"💬",title:"Conselho para viagem",
     lines:[
      {who:"A",en:"I'm going to travel next month. Any advice?",pt:"Vou viajar no mês que vem. Algum conselho?"},
      {who:"B",en:"You should book the hotel early.",pt:"Você deveria reservar o hotel cedo."},
      {who:"A",en:"Do I have to show my passport?",pt:"Preciso mostrar passaporte?"},
      {who:"B",en:"Yes, you must. And you mustn't forget travel insurance.",pt:"Sim, deve. E não pode esquecer o seguro de viagem."}
     ]}
   ]},
  {type:"practice",icon:"✏️",label:"Praticar",desc:"50 exercícios",
   data:[
    {type:"mc",prompt:"'She ___ wear a uniform.' (obrigação externa)",opts:["should","has to","must not","don't have to"],answer:1,why:"Obrigação externa → <b>has to</b> (she → has to)."},
    {type:"mc",prompt:"'You ___ see a doctor.' (conselho)",opts:["have to","must not","should","mustn't"],answer:2,why:"Conselho → <b>should</b>."},
    {type:"mc",prompt:"'You ___ smoke here.' (proibição)",opts:["don't have to","should","must not","have to"],answer:2,why:"Proibição → <b>must not</b> (= mustn't)."},
    {type:"mc",prompt:"'I ___ work tomorrow.' — não é obrigado, mas pode.",opts:["mustn't","shouldn't","don't have to","must not"],answer:2,why:"Não é necessário → <b>don't have to</b>."},
    {type:"mc",prompt:"'We ___ be late.' (obrigação — chegamos por conta própria)",opts:["have to","mustn't","should","don't have to"],answer:1,why:"Obrigação forte self-imposed → <b>mustn't</b>."},
    {type:"mc",prompt:"Pergunta: '___ I call him?'",opts:["Must","Have","Should","Do"],answer:2,why:"Pedido de conselho → <b>Should I call him?</b>"},
    {type:"mc",prompt:"'She ___ to arrive on time.' (obrigação externa, she)",opts:["have","has","should","must"],answer:1,why:"Have to com she → <b>has to</b>."},
    {type:"mc",prompt:"Tradução: 'Você não é obrigado a vir.'",opts:["You must not come.","You should not come.","You don't have to come.","You can't come."],answer:2,why:"Não é necessário → <b>You don't have to come.</b>"},
    {type:"mc",prompt:"'Passengers ___ show ID.' (regra formal)",opts:["should","don't have to","must","have to"],answer:2,why:"Regra formal → <b>must</b>."},
    {type:"mc",prompt:"'You ___ touch that!' (proibição forte)",opts:["don't have to","shouldn't","mustn't","haven't to"],answer:2,why:"Proibição → <b>mustn't</b>."},
    {type:"mc",prompt:"'___ you have to pay?' (pergunta obrigação)",opts:["Should","Must","Do","Are"],answer:2,why:"Pergunta com have to → <b>Do you have to pay?</b>"},
    {type:"mc",prompt:"Qual diferença: must not vs don't have to?",opts:["São iguais","Must not = proibição; don't have to = não é necessário","Don't have to = proibição; must not = conselho","Ambos são conselhos"],answer:1,why:"<b>Must not = PROIBIDO</b>; <b>Don't have to = não é obrigado</b>. Muito diferentes!"},
    {type:"mc",prompt:"'I ___ study more.' (sinto que preciso — autodeterminação)",opts:["should","must","have to","don't have to"],answer:1,why:"Obrigação autodeterminada → <b>must</b>."},
    {type:"mc",prompt:"'She ___ rest. She\u2019s sick.' (conselho)",opts:["must not","has to","should","mustn't"],answer:2,why:"Conselho → <b>should</b>."},
    {type:"mc",prompt:"'They ___ wear a uniform at that school.' (externa, they)",opts:["has to","should","have to","must not"],answer:2,why:"Obrigação externa com THEY → <b>have to</b>."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"You should rest.",opts:["Você é obrigado a descansar.","Você deveria descansar.","Você não pode descansar.","Você precisa descansar imediatamente."],answer:1,why:"<b>should</b> = conselho: você deveria descansar."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"She has to wear a uniform.",opts:["Ela deveria usar uniforme.","Ela tem que usar uniforme.","Ela não usa uniforme.","Ela pode usar uniforme."],answer:1,why:"<b>has to</b> = obrigação: ela tem que usar uniforme."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"You mustn't smoke here.",opts:["Você não precisa fumar aqui.","Você deveria parar de fumar.","Você não pode fumar aqui.","Fumar é permitido aqui."],answer:2,why:"<b>mustn't</b> = proibição: você não pode fumar aqui."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"I don't have to work tomorrow.",opts:["Não posso trabalhar amanhã.","Não sou obrigado a trabalhar amanhã.","Não devo trabalhar amanhã.","Preciso trabalhar amanhã."],answer:1,why:"<b>don't have to</b> = não é necessário — não é proibição."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"Should I see a doctor?",opts:["Devo ir obrigatoriamente ao médico?","Você acha que eu deveria ir ao médico?","Posso ir ao médico?","O médico deve me ver?"],answer:1,why:"<b>Should I</b> = pedido de conselho: você acha que eu deveria...?"},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"We must arrive on time.",opts:["Devemos tentar chegar no horário.","Não precisamos chegar no horário.","Devemos chegar no horário. (obrigação forte)","Chegamos no horário."],answer:2,why:"<b>must</b> = obrigação forte: devemos chegar no horário."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"Do you have to pay?",opts:["Você quer pagar?","Você é obrigado a pagar?","Você deveria pagar?","Você já pagou?"],answer:1,why:"<b>Do you have to pay?</b> = Você é obrigado a pagar?"},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"You don't have to eat here.",opts:["Você não pode comer aqui.","Você não é obrigado a comer aqui.","Você não deve comer aqui.","Você deveria comer em outro lugar."],answer:1,why:"<b>don't have to</b> = não é obrigado — pode comer onde quiser."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"She must not be late.",opts:["Ela não vai chegar atrasada.","Ela não pode chegar atrasada.","Ela não precisa chegar cedo.","Ela deveria chegar cedo."],answer:1,why:"<b>must not</b> = proibição: ela não pode chegar atrasada."},
    {type:"listen",prompt:"Ouça e escolha o significado",sub:"Toque no alto-falante.",audio:"You should drink more water.",opts:["Você é obrigado a beber água.","Você deveria beber mais água.","Você não pode beber água.","Você bebe muita água."],answer:1,why:"<b>should</b> = conselho: você deveria beber mais água."},
    {type:"order",prompt:"Monte a frase",sub:'"Você deveria descansar."',words:["You","should","rest"],why:"<b>You should rest.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Ela tem que usar uniforme."',words:["She","has","to","wear","a","uniform"],why:"<b>She has to wear a uniform.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Você não pode fumar aqui."',words:["You","mustn't","smoke","here"],why:"<b>You mustn't smoke here.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Não sou obrigado a trabalhar amanhã."',words:["I","don't","have","to","work","tomorrow"],why:"<b>I don't have to work tomorrow.</b>"},
    {type:"order",prompt:"Monte a pergunta",sub:'"Você é obrigado a pagar?"',words:["Do","you","have","to","pay"],why:"<b>Do you have to pay?</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Nós devemos chegar no horário." (obrigação forte)',words:["We","must","arrive","on","time"],why:"<b>We must arrive on time.</b>"},
    {type:"order",prompt:"Monte a pergunta",sub:'"Eu deveria ligar para ele?"',words:["Should","I","call","him"],why:"<b>Should I call him?</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Ela deveria ir ao médico."',words:["She","should","see","a","doctor"],why:"<b>She should see a doctor.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Eles têm que seguir as regras."',words:["They","have","to","follow","the","rules"],why:"<b>They have to follow the rules.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Não pode tocar nisso!"',words:["You","mustn't","touch","that"],why:"<b>You mustn't touch that.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Você deveria beber mais água."',words:["You","should","drink","more","water"],why:"<b>You should drink more water.</b>"},
    {type:"order",prompt:"Monte a frase",sub:'"Ela não é obrigada a usar uniforme."',words:["She","doesn't","have","to","wear","a","uniform"],why:"<b>She doesn't have to wear a uniform.</b>"},
    {type:"match",prompt:"Ligue ao uso correto",pairs:[["have to / has to","obrigação externa"],["should","conselho"],["must not / mustn't","proibição"],["don't have to","não é necessário"]]},
    {type:"match",prompt:"Ligue a frase à tradução",pairs:[["You should rest.","Você deveria descansar."],["She has to work.","Ela tem que trabalhar."],["You mustn't smoke.","Você não pode fumar."],["I don't have to go.","Não sou obrigado a ir."]]},
    {type:"match",prompt:"Ligue a pergunta à resposta",pairs:[["Should I come?","Yes, you should."],["Do I have to pay?","No, you don't have to."],["Must I wear this?","Yes, you must."],["Should she rest?","Yes, she should."]]},
    {type:"match",prompt:"Ligue must not vs don't have to",pairs:[["proibição forte","must not"],["não é necessário","don't have to"],["You can't eat here.","mustn't"],["You can eat if you want.","don't have to"]]},
    {type:"match",prompt:"Ligue ao verbo modal correto",pairs:[["Ela tem que chegar cedo.","has to"],["Você deveria dormir mais.","should"],["Não pode entrar.","must not"],["Não precisa vir.","don't have to"]]}
   ]},
  {type:"quiz",icon:"🏆",label:"Quiz",desc:"30 questões — ≥80% para passar",
   data:[
    {type:"mc",prompt:"'She ___ to work on Sundays.' (obrigação externa, she)",opts:["have","has","should","must"],answer:1,why:"Obrigação externa com she → <b>has to</b>."},
    {type:"mc",prompt:"'You ___ see a doctor.' (conselho)",opts:["must","have to","should","mustn't"],answer:2,why:"Conselho → <b>should</b>."},
    {type:"mc",prompt:"'You ___ enter here.' (proibição)",opts:["don't have to","should not","must not","haven't to"],answer:2,why:"Proibição → <b>must not</b>."},

  {type:"dialogue",icon:"🎧",label:"Diálogos",desc:"Usando perguntas avançadas",
   data:[
    {emj:"💬",title:"Planejando uma viagem",
     lines:[
      {who:"A",en:"Why do you want to go to Japan?",pt:"Por que você quer ir ao Japão?"},
      {who:"B",en:"Because I love Japanese culture.",pt:"Porque amo a cultura japonesa."},
      {who:"A",en:"How long are you going to stay?",pt:"Por quanto tempo você vai ficar?"},
      {who:"B",en:"For two weeks. How far is Tokyo from Osaka?",pt:"Por duas semanas. Quão longe é Tóquio de Osaka?"},
      {who:"A",en:"About three hours by train.",pt:"Cerca de três horas de trem."}
     ]},
    {emj:"💬",title:"Na academia",
     lines:[
      {who:"A",en:"How often do you come to the gym?",pt:"Com que frequência você vem à academia?"},
      {who:"B",en:"Three times a week. And you?",pt:"Três vezes por semana. E você?"},
      {who:"A",en:"Only once a week. Why do you exercise so much?",pt:"Só uma vez por semana. Por que você se exercita tanto?"},
      {who:"B",en:"Because I have a competition next month.",pt:"Porque tenho uma competição no mês que vem."},
      {who:"A",en:"Whose training program is that?",pt:"De quem é esse programa de treino?"}
     ]},
    {emj:"💬",title:"Comprando roupas",
     lines:[
      {who:"A",en:"Which jacket do you prefer?",pt:"Qual jaqueta você prefere?"},
      {who:"B",en:"I like this one. What size is it?",pt:"Gosto desta. Qual é o tamanho?"},
      {who:"A",en:"It's a medium. What kind of material is it?",pt:"É um médio. Que tipo de material é?"},
      {who:"B",en:"It's cotton. How much does it cost?",pt:"É algodão. Quanto custa?"}
     ]}
   ]},

{id:"ch21",n:21,title:"Advérbios & expressões de tempo",sub:"Already, yet, just, still, ago e mais",

 vocab:[
  {e:"already",p:"já"},{e:"yet",p:"ainda (não) / já (pergunta)"},

 sections:[
  {type:"notes",icon:"🧩",label:"Gramática",desc:"Advérbios de modo e tempo",
   title:"Advérbios — como e quando",
   intro:"Advérbios modificam verbos, adjetivos ou outros advérbios. Em inglês eles geralmente vêm depois do verbo ou no fim da frase.",
   data:[
    {emj:"🏃",title:"Advérbios de modo — como algo acontece",
     html:'Adjetivo + <span class="en">-ly</span> = advérbio de modo:',
     table:[["quick → quickly","rápido → rapidamente"],["careful → carefully","cuidadoso → com cuidado"],["slow → slowly","lento → devagar"],["loud → loudly","alto → em voz alta"]]},
    {emj:"⚠️",title:"Irregulares — decorar",
     html:'Alguns advérbios não seguem o padrão:',
     table:[["good → well","bom → bem"],["hard → hard","difícil/muito → muito/duro"],["fast → fast","rápido → rapidamente"],["late → late","atrasado → tarde"]]},
    {emj:"✅",title:"Already — já (fato positivo)",
     html:'<span class="en">Already</span> indica que algo já aconteceu (antes do esperado):',
     table:[["I already ate.","Eu já comi."],["She already left.","Ela já foi."],["Have you already done it?","Você já fez isso?"]]},
    {emj:"❌",title:"Yet — ainda não / já (pergunta)",
     html:'<span class="en">Yet</span> = ainda não (negativo) ou já? (pergunta), sempre no fim da frase:',
     table:[["I haven't finished yet.","Ainda não terminei."],["Have you eaten yet?","Você já comeu?"],["She isn't ready yet.","Ela ainda não está pronta."]]},
    {emj:"⚡",title:"Just — acabou de (ação muito recente)",
     html:'<span class="en">Just</span> = há pouco / acabou de:',
     table:[["I just arrived.","Acabei de chegar."],["She just called.","Ela acabou de ligar."],["I just need a minute.","Só preciso de um minuto."]]},
    {emj:"🔄",title:"Still — ainda (ação que continua)",
     html:'<span class="en">Still</span> = ainda, indica continuidade:',
     table:[["I still live here.","Ainda moro aqui."],["She is still working.","Ela ainda está trabalhando."],["Are you still tired?","Você ainda está cansada?"]]},
    {emj:"📅",title:"Ago — atrás (no passado)",
     html:'<span class="en">Ago</span> vem depois do período de tempo:',
     table:[["two hours ago","duas horas atrás"],["a week ago","uma semana atrás"],["three years ago","três anos atrás"]]},
    {warn:true,emj:"⚠️",title:"Already / Yet / Still — como não confundir",
     html:'<span class="en">Already</span> = já aconteceu ✅. <span class="en">Yet</span> = ainda não (❌) ou já? (?). <span class="en">Still</span> = continua acontecendo 🔄. <span class="en2">I already ate. / I haven\u2019t eaten yet. / I\u2019m still eating.</span>'}
   ]},

  {type:"dialogue",icon:"🎧",label:"Diálogos",desc:"Advérbios no dia a dia",
   data:[
    {emj:"💬",title:"Chegando para o trabalho",
     lines:[
      {who:"A",en:"You arrived early today!",pt:"Você chegou cedo hoje!"},
      {who:"B",en:"Yes, I woke up at six. I already had breakfast.",pt:"Sim, acordei às seis. Já tomei café da manhã."},
      {who:"A",en:"Have you started the report yet?",pt:"Você já começou o relatório?"},
      {who:"B",en:"No, not yet. But I just finished the email.",pt:"Não, ainda não. Mas acabei de terminar o e-mail."},
      {who:"A",en:"Good. The boss is still in the meeting.",pt:"Ótimo. O chefe ainda está na reunião."}
     ]},
    {emj:"💬",title:"Contando o passado",
     lines:[
      {who:"A",en:"When did you move here?",pt:"Quando você se mudou para cá?"},
      {who:"B",en:"Three years ago. It was a big change.",pt:"Três anos atrás. Foi uma grande mudança."},
      {who:"A",en:"Do you still miss your old city?",pt:"Você ainda sente falta da sua cidade antiga?"},
      {who:"B",en:"Sometimes. But I'm really happy here now.",pt:"Às vezes. Mas estou muito feliz aqui agora."}
     ]},
    {emj:"💬",title:"Aprendendo inglês",
     lines:[
      {who:"A",en:"How is your English going?",pt:"Como está indo o seu inglês?"},
      {who:"B",en:"It's going well! I practice every day.",pt:"Está indo bem! Pratico todo dia."},
      {who:"A",en:"Have you finished the course yet?",pt:"Você já terminou o curso?"},
      {who:"B",en:"Not yet. But I already completed twelve chapters.",pt:"Ainda não. Mas já completei doze capítulos."},
      {who:"A",en:"Wow, that was quick! You learn fast.",pt:"Nossa, foi rápido! Você aprende rápido."}
     ]}
   ]},

    {emj:"🔄",title:"Cap 13: Present continuous",
     html:'<span class="en">am/is/are + -ing</span> = o que está acontecendo AGORA: <span class="en2">I\u2019m eating</span>, <span class="en2">She\u2019s working</span>, <span class="en2">Are they sleeping?</span>'},
    {emj:"⏮️",title:"Cap 14–16: Past simple",
     html:'<b>Was/were</b> (to be no passado). <b>-ed</b> nos regulares: <span class="en2">worked, watched, studied</span>. <b>Irregulares</b>: <span class="en2">went, had, came, saw</span>. Negativo: <span class="en2">didn\u2019t + forma base</span>.'},
    {emj:"📅",title:"Cap 17: Future",
     html:'<span class="en">Going to</span> = planos decididos. <span class="en">Will</span> = decisão espontânea / previsão. Negativo: <span class="en2">won\u2019t</span> (will not).'},
    {emj:"⚖️",title:"Cap 18: Comparativos & superlativos",
     html:'Curtos: <span class="en2">taller than / the tallest</span>. Longos: <span class="en2">more interesting / the most interesting</span>. Irregulares: <span class="en2">better / the best / worse / the worst</span>.'},
    {emj:"📋",title:"Cap 19: Have to / should / must",
     html:'<span class="en">Have to</span> = obrigação externa. <span class="en">Should</span> = conselho. <span class="en">Must not</span> = proibição. <span class="en">Don\u2019t have to</span> = não é necessário.'},
    {emj:"❓",title:"Cap 20–21: Perguntas e advérbios",
     html:'<span class="en">Why / How long / How often / How far / Whose / Which</span>. Advérbios: <span class="en2">already, yet, just, still, ago</span>. Modo: <span class="en2">carefully, slowly, well</span>.'},

     html:'Corpo: <span class="en2">headache, fever, sore throat, dizzy</span>. No médico: <span class="en2">Where does it hurt?</span> Viagem: <span class="en2">passport, boarding pass, Turn left, I have a reservation</span>.'},
