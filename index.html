<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Inglês da Haruko 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --paper:#FBF8F3;
  --card:#FFFFFF;
  --ink:#2B2B33;
  --ink-soft:#6B6B76;
  --ink-faint:#A8A8B3;
  --sakura:#E8537A;
  --sakura-deep:#C93A60;
  --sakura-soft:#FCE9EF;
  --leaf:#3D8B66;
  --leaf-soft:#E7F3ED;
  --gold:#D9A441;
  --gold-soft:#FBF3E2;
  --line:#EDE6DB;
  --shadow:0 2px 12px rgba(43,43,51,.07);
  --shadow-lift:0 6px 24px rgba(43,43,51,.12);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:19px;background:var(--paper);}
body{
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--paper);color:var(--ink);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ===== TOP BAR ===== */
.bar{
  position:sticky;top:0;z-index:50;
  background:rgba(251,248,243,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.bar .back{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  display:none;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow);
}
.bar .back.show{display:flex;}
.bar .back svg{width:20px;height:20px;stroke:var(--ink);}
.bar-title{font-weight:800;font-size:.92rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .slowbtn{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.78rem;
  background:var(--card);box-shadow:var(--shadow);color:var(--ink-soft);
  border:1.5px solid transparent;
}
.bar .slowbtn.on{background:var(--sakura-soft);color:var(--sakura-deep);border-color:var(--sakura);}
.mbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;display:none;}
.mbar.show{display:block;}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sakura),var(--gold));border-radius:99px;transition:width .4s cubic-bezier(.22,1,.36,1);width:0%;}

/* ===== APP CONTAINER ===== */
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 110px);}

/* ===== REVEAL ANIM ===== */
.reveal{opacity:0;transform:translateY(14px);animation:rev .5s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes rev{to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none;}}

/* ===== HOME ===== */
.hello{margin:10px 2px 4px;}
.hello h1{font-size:1.9rem;font-weight:900;line-height:1.15;}
.hello h1 .pink{color:var(--sakura);}
.hello .sub{color:var(--ink-soft);font-size:.95rem;margin-top:8px;font-weight:600;line-height:1.5;}

.stat-row{display:flex;gap:10px;margin:16px 0 6px;}
.stat{
  flex:1;background:var(--card);border-radius:var(--r);padding:14px 12px;
  box-shadow:var(--shadow);text-align:center;
}
.stat .n{font-size:1.55rem;font-weight:900;color:var(--sakura);line-height:1;}
.stat .l{font-size:.72rem;font-weight:700;color:var(--ink-soft);margin-top:8px;line-height:1.4;}
.stat.gold .n{color:var(--gold);}
.stat.leaf .n{color:var(--leaf);}

.review-cta{
  display:flex;align-items:center;gap:14px;width:100%;
  background:linear-gradient(135deg,var(--sakura),var(--sakura-deep));
  color:#fff;border-radius:var(--r);padding:18px 18px;margin:14px 0 4px;
  box-shadow:0 8px 24px rgba(232,83,122,.35);text-align:left;
}
.review-cta .em{font-size:1.8rem;}
.review-cta .t{font-weight:900;font-size:1.05rem;display:block;margin-bottom:4px;}
.review-cta .s{font-size:.82rem;opacity:.92;font-weight:600;display:block;line-height:1.4;}
.review-cta .go{margin-left:auto;font-size:1.3rem;}
.review-done{
  display:flex;align-items:center;gap:10px;background:var(--leaf-soft);color:var(--leaf);
  border-radius:var(--r);padding:14px 16px;margin:14px 0 4px;font-weight:800;font-size:.9rem;
}

/* trail */
.level-tag{
  display:flex;align-items:center;gap:10px;margin:26px 4px 14px;
}
.level-tag .ln{
  font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--sakura-deep);
  background:var(--sakura-soft);padding:5px 12px;border-radius:99px;
}
.level-tag .lt{font-weight:800;font-size:.95rem;color:var(--ink-soft);}
.level-tag.locked .ln{background:var(--line);color:var(--ink-faint);}
.level-tag.locked .lt{color:var(--ink-faint);}

.trail{position:relative;padding-left:34px;}
.trail::before{
  content:"";position:absolute;left:14px;top:8px;bottom:8px;width:3px;
  background:var(--line);border-radius:99px;
}
.m-card{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;
  box-shadow:var(--shadow);text-align:left;transition:transform .15s;
}
.m-card:active{transform:scale(.985);}
.m-card::before{
  content:"";position:absolute;left:-26px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;background:var(--paper);
  border:3px solid var(--ink-faint);
}
.m-card.done::before{background:var(--sakura);border-color:var(--sakura);}
.m-card.next::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft);}
.m-card .em{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;
  background:var(--sakura-soft);
}
.m-card.done .em{background:var(--leaf-soft);}
.m-card .body{flex:1;min-width:0;}
.m-card .t{font-weight:800;font-size:.98rem;line-height:1.3;display:block;}
.m-card .s{font-size:.78rem;color:var(--ink-soft);font-weight:600;margin-top:5px;line-height:1.45;display:block;}
.m-card .mark{flex:0 0 auto;font-size:1.25rem;}
.m-card .mark .badge-next{
  font-size:.68rem;font-weight:900;letter-spacing:.06em;color:var(--sakura-deep);
  background:var(--sakura-soft);padding:5px 10px;border-radius:99px;text-transform:uppercase;
}
.m-card.locked{opacity:.55;}
.m-card.locked .em{background:var(--line);}

.note{font-size:.8rem;color:var(--ink-faint);text-align:center;margin:22px 12px;font-weight:600;line-height:1.5;}

/* reset zone */
.reset-zone{margin-top:8px;text-align:center;}
.reset-btn{font-size:.8rem;font-weight:700;color:var(--ink-faint);padding:10px 16px;}
.reset-warn{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);font-size:.88rem;line-height:1.5;}
.reset-warn p{margin-bottom:12px;}
.btn-danger{background:#D14545;color:#fff;font-weight:800;padding:11px 18px;border-radius:12px;margin:4px;}
.btn-cancel{background:var(--line);color:var(--ink);font-weight:800;padding:11px 18px;border-radius:12px;margin:4px;}

/* ===== MISSION FLOW ===== */
.step-wrap{padding-top:6px;}
.step-tag{
  font-size:.74rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sakura-deep);margin-bottom:8px;
}
.step-title{font-size:1.55rem;font-weight:900;line-height:1.25;margin-bottom:10px;}
.step-lead{color:var(--ink-soft);font-size:.95rem;font-weight:600;line-height:1.55;margin-bottom:18px;}

/* intro / can-do */
.mission-hero{
  background:var(--card);border-radius:22px;padding:24px 20px;box-shadow:var(--shadow);
  text-align:center;margin-bottom:16px;
}
.mission-hero .em{font-size:3rem;line-height:1;}
.mission-hero h2{font-size:1.45rem;font-weight:900;margin:12px 0 0;}
.mission-hero .s{color:var(--ink-soft);font-weight:600;font-size:.92rem;margin-top:6px;line-height:1.55;}
.cando{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.cando .k{font-size:.74rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.cando ul{list-style:none;}
.cando li{
  display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:.95rem;
  padding:9px 0;line-height:1.5;
}
.cando li::before{content:"🌸";flex:0 0 auto;font-size:.9rem;margin-top:1px;}

/* dialogue */
.dlg{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;}
.dlg-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1rem;margin-bottom:4px;}
.dlg-sub{font-size:.82rem;color:var(--ink-soft);font-weight:600;margin-bottom:14px;}
.play-all{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--ink);color:#fff;font-weight:800;font-size:.92rem;
  padding:14px;border-radius:14px;margin-bottom:14px;
}
.play-all svg{width:18px;height:18px;fill:#fff;}
.line{
  display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:14px;
  margin-bottom:2px;transition:background .25s;
}
.line.hl{background:var(--sakura-soft);}
.line .who{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:900;color:#fff;background:var(--sakura);margin-top:2px;
}
.line:nth-child(odd) .who{background:var(--leaf);}
.line .ct{flex:1;min-width:0;}
.line .en{font-weight:800;font-size:1.02rem;line-height:1.35;display:block;}
.line .pt{font-size:.85rem;color:var(--ink-soft);font-weight:600;line-height:1.45;display:block;margin-top:4px;}
.line .spk{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--paper);
}
.line .spk svg{width:19px;height:19px;fill:var(--sakura);}
.pt-toggle{
  display:block;margin:10px auto 0;font-size:.82rem;font-weight:800;color:var(--sakura-deep);
  padding:10px 18px;background:var(--sakura-soft);border-radius:99px;
}
.dlg.hide-pt .line .pt{display:none;}

/* discovery */
.disc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:13px;}
.disc .h{display:flex;gap:10px;align-items:center;font-weight:900;font-size:1rem;margin-bottom:12px;}
.disc .h .em{font-size:1.2rem;}
.disc p{font-size:.95rem;line-height:1.6;color:var(--ink);font-weight:600;}
.disc p .en{color:var(--sakura-deep);font-weight:800;}
.disc .ex{
  background:var(--paper);border-radius:12px;padding:12px 14px;margin-top:10px;
  display:flex;align-items:center;gap:10px;
}
.disc .ex .txt{flex:1;}
.disc .ex .e{font-weight:800;font-size:1rem;display:block;}
.disc .ex .p{font-size:.82rem;color:var(--ink-soft);font-weight:600;display:block;margin-top:4px;line-height:1.4;}
.disc .ex .spk{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow);}
.disc .ex .spk svg{width:17px;height:17px;fill:var(--sakura);}
.disc.warn{border-left:4px solid var(--gold);}

/* ===== EXERCISE CARD (one at a time) ===== */
.ex-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow-lift);padding:24px 20px;}
.ex-count{font-size:.76rem;font-weight:900;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:14px;text-transform:uppercase;}
.ex-prompt{font-size:1.25rem;font-weight:900;line-height:1.35;margin-bottom:10px;}
.ex-sub{font-size:.88rem;color:var(--ink-soft);font-weight:600;margin-bottom:16px;}

/* think (Pimsleur anticipation) */
.think-q{
  background:var(--sakura-soft);border-radius:16px;padding:20px 18px;text-align:center;
  font-size:1.3rem;font-weight:900;color:var(--sakura-deep);line-height:1.35;margin-bottom:16px;
}
.think-hint{font-size:.84rem;color:var(--ink-soft);font-weight:600;text-align:center;margin-bottom:16px;line-height:1.5;}
.think-answer{
  background:var(--paper);border-radius:16px;padding:20px 18px;text-align:center;margin-bottom:14px;
}
.think-answer .en{font-size:1.45rem;font-weight:900;display:block;line-height:1.3;}
.think-answer .spk-big{
  width:54px;height:54px;border-radius:50%;background:var(--sakura);margin:14px auto 0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(232,83,122,.4);
}
.think-answer .spk-big svg{width:24px;height:24px;fill:#fff;}
.self-row{display:flex;gap:10px;}
.self-btn{
  flex:1;padding:16px;border-radius:16px;font-weight:900;font-size:1rem;
}
.self-btn.yes{background:var(--leaf-soft);color:var(--leaf);}
.self-btn.no{background:var(--sakura-soft);color:var(--sakura-deep);}

/* mc options */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  width:100%;text-align:left;background:var(--paper);border:2px solid transparent;
  border-radius:16px;padding:16px 16px;font-weight:800;font-size:1rem;line-height:1.35;
  transition:all .15s;
}
.opt:active{transform:scale(.985);}
.opt.sel-right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);}
.opt.sel-wrong{background:#FBE9E9;border-color:#D14545;color:#B03030;}
.opt.show-right{border-color:var(--leaf);background:var(--leaf-soft);}
.opt:disabled{opacity:.92;}

/* listen */
.listen-big{
  width:88px;height:88px;border-radius:50%;background:var(--sakura);
  display:flex;align-items:center;justify-content:center;margin:6px auto 20px;
  box-shadow:0 6px 20px rgba(232,83,122,.4);
}
.listen-big svg{width:38px;height:38px;fill:#fff;}

/* build (sentence blocks) */
.build-zone{
  min-height:64px;background:var(--paper);border-radius:16px;border:2px dashed var(--line);
  display:flex;flex-wrap:wrap;gap:8px;padding:12px;margin-bottom:14px;align-items:center;
}
.build-zone.ok{border-color:var(--leaf);background:var(--leaf-soft);}
.build-zone.bad{border-color:#D14545;background:#FBE9E9;}
.chip{
  background:var(--card);box-shadow:var(--shadow);border-radius:12px;
  padding:11px 15px;font-weight:800;font-size:1rem;
}
.chip.in{background:var(--ink);color:#fff;box-shadow:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip.used{opacity:.25;pointer-events:none;}

/* feedback */
.fb{
  border-radius:16px;padding:14px 16px;margin-top:14px;font-size:.92rem;line-height:1.5;font-weight:700;
}
.fb.ok{background:var(--leaf-soft);color:var(--leaf);}
.fb.no{background:#FBE9E9;color:#B03030;}
.fb b{font-weight:900;}

/* ===== FOOTER CTA ===== */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(to top,var(--paper) 65%,transparent);
  padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);
}
.foot .inner{max-width:560px;margin:0 auto;}
.cta{
  width:100%;background:var(--ink);color:#fff;font-weight:900;font-size:1.08rem;
  padding:18px;border-radius:18px;box-shadow:0 6px 20px rgba(43,43,51,.25);
  transition:transform .12s,opacity .2s;
}
.cta:active{transform:scale(.98);}
.cta.pink{background:linear-gradient(135deg,var(--sakura),var(--sakura-deep));box-shadow:0 6px 20px rgba(232,83,122,.4);}
.cta:disabled{opacity:.35;}

/* ===== DONE SCREEN ===== */
.done-hero{text-align:center;padding:30px 10px 10px;}
.done-hero .flower{font-size:4.5rem;line-height:1;animation:bloom .8s cubic-bezier(.22,1.6,.36,1);display:inline-block;}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg);}100%{transform:scale(1) rotate(0);}}
.done-hero h2{font-size:1.7rem;font-weight:900;margin:16px 0 0;}
.done-hero .s{color:var(--ink-soft);font-weight:600;font-size:.95rem;line-height:1.6;margin-top:8px;}
.newphrases{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:18px 0 12px;}
.newphrases .k{font-size:.74rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--sakura-deep);margin-bottom:10px;}
.newphrases .ph{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
}
.newphrases .ph:last-child{border-bottom:none;}
.newphrases .ph .txt{flex:1;}
.newphrases .ph .e{font-weight:800;font-size:.98rem;display:block;}
.newphrases .ph .p{font-size:.8rem;color:var(--ink-soft);font-weight:600;display:block;margin-top:3px;line-height:1.4;}
.newphrases .ph .spk{width:38px;height:38px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.newphrases .ph .spk svg{width:17px;height:17px;fill:var(--sakura);}
.srs-note{
  display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:var(--r);
  padding:14px 16px;font-size:.85rem;font-weight:700;color:#8A6A20;line-height:1.5;
}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.confetti i{
  position:absolute;width:10px;height:10px;border-radius:3px;opacity:.95;
  animation:fall 2.6s ease-in forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

/* result */
.result-ring{
  width:130px;height:130px;border-radius:50%;margin:14px auto;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--leaf) calc(var(--pct)*1%),var(--line) 0);
  position:relative;
}
.result-ring::before{content:"";position:absolute;inset:10px;background:var(--paper);border-radius:50%;}
.result-ring .n{position:relative;font-size:1.6rem;font-weight:900;color:var(--leaf);}
.result-ring .l{position:relative;font-size:.7rem;font-weight:800;color:var(--ink-soft);}


/* ===== MODO CONVERSA ===== */
.conv-cta{
  display:flex;align-items:center;gap:14px;width:100%;
  background:linear-gradient(135deg,var(--leaf),#2E6E50);
  color:#fff;border-radius:var(--r);padding:18px;margin:14px 0 4px;
  box-shadow:0 8px 24px rgba(61,139,102,.32);text-align:left;
}
.conv-cta .em{font-size:1.8rem;}
.conv-cta .t{font-weight:900;font-size:1.05rem;display:block;margin-bottom:4px;}
.conv-cta .s{font-size:.82rem;opacity:.93;font-weight:600;display:block;line-height:1.4;}
.conv-cta .go{margin-left:auto;font-size:1.3rem;}

.scene-list{margin-top:4px;}
.scene-card{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;
  background:var(--card);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;
  box-shadow:var(--shadow);text-align:left;transition:transform .15s;
}
.scene-card:active{transform:scale(.985);}
.scene-card .em{
  width:48px;height:48px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:var(--leaf-soft);
}
.scene-card .body{flex:1;min-width:0;}
.scene-card .t{font-weight:800;font-size:.98rem;line-height:1.3;display:block;}
.scene-card .s{font-size:.78rem;color:var(--ink-soft);font-weight:600;margin-top:4px;line-height:1.45;display:block;}
.scene-card .lvl{font-size:.68rem;font-weight:800;color:var(--leaf);background:var(--leaf-soft);padding:4px 9px;border-radius:99px;flex:0 0 auto;}
.scene-card .mark{flex:0 0 auto;font-size:1.15rem;}

.conv-intro{background:var(--card);border-radius:22px;padding:24px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px;}
.conv-intro .em{font-size:3rem;}
.conv-intro h2{font-size:1.4rem;font-weight:900;margin:10px 0 4px;}
.conv-intro .s{color:var(--ink-soft);font-weight:600;font-size:.92rem;line-height:1.55;margin-top:6px;}
.conv-intro .who-am-i{background:var(--leaf-soft);color:var(--leaf);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:800;font-size:.9rem;line-height:1.4;}

/* bolha de conversa */
.chat-area{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
.bubble{max-width:84%;padding:13px 16px;border-radius:20px;font-weight:700;line-height:1.4;position:relative;animation:rev .4s cubic-bezier(.22,1,.36,1) forwards;}
.bubble .en{font-size:1.05rem;display:block;}
.bubble .pt{font-size:.82rem;opacity:.75;font-weight:600;display:block;margin-top:4px;}
.bubble.them{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px;}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--sakura),var(--sakura-deep));color:#fff;border-bottom-right-radius:6px;}
.bubble.me .pt{opacity:.9;}
.bubble .spk-inline{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:800;background:var(--paper);color:var(--sakura-deep);padding:6px 12px;border-radius:99px;}
.bubble .spk-inline svg{width:14px;height:14px;fill:var(--sakura);}
.bubble.typing{background:var(--card);box-shadow:var(--shadow);align-self:flex-start;padding:16px 20px;border-bottom-left-radius:6px;}
.bubble.typing span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-faint);margin:0 2px;animation:typing 1.2s infinite;}
.bubble.typing span:nth-child(2){animation-delay:.2s;}
.bubble.typing span:nth-child(3){animation-delay:.4s;}
@keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-4px);}}

/* prompt de resposta (Pimsleur) */
.your-turn{background:var(--sakura-soft);border-radius:18px;padding:18px;margin-top:6px;}
.your-turn .lbl{font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--sakura-deep);margin-bottom:8px;}
.your-turn .task{font-size:1.12rem;font-weight:900;color:var(--ink);line-height:1.35;}
.your-turn .hint{font-size:.84rem;color:var(--ink-soft);font-weight:600;margin-top:8px;line-height:1.45;}
.reveal-ans{background:var(--paper);border-radius:16px;padding:18px;text-align:center;margin-top:12px;}
.reveal-ans .en{font-size:1.3rem;font-weight:900;display:block;line-height:1.3;}
.reveal-ans .pt{font-size:.84rem;color:var(--ink-soft);font-weight:600;display:block;margin-top:5px;}
.reveal-ans .spk-big{width:52px;height:52px;border-radius:50%;background:var(--sakura);margin:12px auto 0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(232,83,122,.4);}
.reveal-ans .spk-big svg{width:23px;height:23px;fill:#fff;}

.mbar-wrap{max-width:560px;margin:0 auto;padding:0 16px;}

<body>
<div class="bar">
  <button class="back" id="backBtn" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="bar-title" id="barTitle">Inglês da Haruko 🌸</div>
  <button class="slowbtn" id="slowBtn">🐢 Devagar</button>
</div>
<div class="mbar-wrap"><div class="mbar" id="mbar"><i id="mbarFill"></i></div></div>
<div id="app"></div>
<div class="foot" id="foot" style="display:none"><div class="inner"><button class="cta" id="ctaBtn">Continuar</button></div></div>
<script>
/* ============================================================
   INGLÊS DA HARUKO — engine v2
   Método: missões (can-do CEFR) + diálogo primeiro (Assimil)
   + produção ativa (Pimsleur anticipation) + revisão espaçada
   (Leitner 5 caixas: 0, 1, 3, 7, 21 dias)
   ============================================================ */

/* ===== STATE ===== */
const SKEY='haruko_v2';
let S=load();
function load(){
  try{const raw=localStorage.getItem(SKEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {done:{},srs:{},streak:{last:null,count:0},best:{},conv:{}};
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}

/* ===== SRS (Leitner) ===== */
const BOX_DAYS=[0,1,3,7,21];
function today(){const d=new Date();return Math.floor(d.getTime()/86400000);}
function srsAdd(id){if(!S.srs[id])S.srs[id]={box:1,due:today()+BOX_DAYS[1]};}
function srsAnswer(id,ok){
  const c=S.srs[id];if(!c)return;
  if(ok){c.box=Math.min(5,c.box+1);c.due=today()+BOX_DAYS[Math.min(4,c.box-1)]+(c.box>=5?21:0);}
  else{c.box=1;c.due=today();}
  save();
}
function srsDue(){
  const t=today();const out=[];
  for(const id in S.srs){if(S.srs[id].due<=t)out.push(id);}
  return out;
}
function phraseById(id){
  for(const m of MISSIONS){for(const p of (m.keyPhrases||[])){if(p.id===id)return p;}}
  return null;
}
function totalPhrasesKnown(){return Object.keys(S.srs).length;}

/* ===== STREAK ===== */
function bumpStreak(){
  const t=today();
  if(S.streak.last===t)return;
  if(S.streak.last===t-1)S.streak.count++;
  else S.streak.count=1;
  S.streak.last=t;save();
}
function streakAlive(){return S.streak.last===today()||S.streak.last===today()-1;}

/* ===== TTS ===== */
let SLOW=false;
const synth=window.speechSynthesis;
let VOICE=null;
function pickVoice(){
  const vs=synth?synth.getVoices():[];
  VOICE=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang))||null;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function speak(text,cb){
  if(!synth){if(cb)cb();return;}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';if(VOICE)u.voice=VOICE;
  u.rate=SLOW?0.62:0.92;u.pitch=1.0;
  if(cb)u.onend=cb;
  synth.speak(u);
}
document.getElementById('slowBtn').onclick=function(){
  SLOW=!SLOW;this.classList.toggle('on',SLOW);
  this.textContent=SLOW?'🐢 Devagar ✓':'🐢 Devagar';
};

/* ===== SVG ===== */
const SVG={
  spk:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
};

/* ===== NAV ===== */
const app=document.getElementById('app');
const foot=document.getElementById('foot');
const ctaBtn=document.getElementById('ctaBtn');
const backBtn=document.getElementById('backBtn');
const mbar=document.getElementById('mbar');
const mbarFill=document.getElementById('mbarFill');
let VIEW='home';     // home | mission | review
let MI=0;            // mission index
let STEP=0;          // step in mission flow
let STEPS=[];        // built steps for current mission
backBtn.onclick=()=>{
  if(synth)synth.cancel();
  if(VIEW==='home')return;
  if(VIEW==='mission'){
    if(STEP>0){STEP--;renderStep();}
    else goHome();
    return;
  }
  if(VIEW==='conv'){startConvHub();return;}
  if(VIEW==='convhub'){goHome();return;}
  goHome();
};
function setBar(title,showBack,pct){
  document.getElementById('barTitle').textContent=title;
  backBtn.classList.toggle('show',!!showBack);
  if(pct===undefined){mbar.classList.remove('show');}
  else{mbar.classList.add('show');mbarFill.style.width=pct+'%';}
}
function showFoot(label,fn,pink){
  foot.style.display='block';
  ctaBtn.textContent=label;
  ctaBtn.className='cta'+(pink?' pink':'');
  ctaBtn.disabled=false;
  ctaBtn.onclick=fn;
}
function hideFoot(){foot.style.display='none';}

/* ===== HOME ===== */
function goHome(){
  VIEW='home';window.scrollTo(0,0);hideFoot();
  setBar('Inglês da Haruko 🌸',false);
  const due=srsDue();
  const known=totalPhrasesKnown();
  const doneN=MISSIONS.filter(m=>S.done[m.id]).length;
  // next mission = first not done
  let nextIdx=MISSIONS.findIndex(m=>!S.done[m.id]);
  if(nextIdx<0)nextIdx=MISSIONS.length-1;

  const hour=new Date().getHours();
  const greet=hour<12?'Bom dia':(hour<18?'Boa tarde':'Boa noite');

  let levelsHtml='';
  const levels=[...new Set(MISSIONS.map(m=>m.level))];
  levels.forEach(lv=>{
    const ms=MISSIONS.filter(m=>m.level===lv);
    const lvName=LEVEL_NAMES[lv]||('Nível '+lv);
    const cards=ms.map(m=>{
      const i=MISSIONS.indexOf(m);
      const done=!!S.done[m.id];
      const isNext=i===nextIdx;
      const cls=done?'done':(isNext?'next':'');
      let mark=done?'🌸':(isNext?'<span class="badge-next">Começar</span>':'');
      return `<button class="m-card ${cls} reveal" style="animation-delay:${0.05*i+0.05}s" data-mi="${i}">
        <span class="em">${m.emoji}</span>
        <span class="body"><span class="t">${m.title}</span><span class="s">${m.sub}</span></span>
        <span class="mark">${mark}</span></button>`;
    }).join('');
    levelsHtml+=`<div class="level-tag reveal"><span class="ln">Nível ${lv}</span><span class="lt">${lvName}</span></div><div class="trail">${cards}</div>`;
  });

  const reviewBlock=due.length>0
    ?`<button class="review-cta reveal" id="reviewBtn" style="animation-delay:.1s">
        <span class="em">🔁</span>
        <span><span class="t">Revisão de hoje</span><span class="s">${due.length} ${due.length===1?'frase espera':'frases esperam'} por você</span></span>
        <span class="go">→</span></button>`
    :(known>0?`<div class="review-done reveal" style="animation-delay:.1s">✓ Revisão de hoje em dia. Volte amanhã! 🌱</div>`:'');

  app.innerHTML=`
    <div class="hello reveal">
      <h1>${greet}, <span class="pink">Haruko</span>! 🌸</h1>
      <div class="sub">Pronta para falar um pouco de inglês?</div>
    </div>
    <div class="stat-row reveal" style="animation-delay:.05s">
      <div class="stat"><div class="n">${known}</div><div class="l">frases que você<br>já sabe dizer</div></div>
      <div class="stat gold"><div class="n">${streakAlive()?S.streak.count:0}</div><div class="l">dias seguidos<br>estudando</div></div>
      <div class="stat leaf"><div class="n">${doneN}</div><div class="l">missões<br>cumpridas</div></div>
    </div>
    ${reviewBlock}
    <button class="conv-cta reveal" id="convBtn" style="animation-delay:.12s">
      <span class="em">💬</span>
      <span><span class="t">Modo Conversa</span><span class="s">Pratique conversas de verdade — ${SCENES.length} cenas</span></span>
      <span class="go">→</span></button>
    ${levelsHtml}
    <div class="note">Toque em qualquer 🔊 para ouvir.<br>O botão 🐢 deixa a voz mais lenta.</div>
    <div class="reset-zone" id="resetZone"></div>`;
  app.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>startMission(+b.getAttribute('data-mi')));
  const rb=document.getElementById('reviewBtn');if(rb)rb.onclick=startReview;
  const cb=document.getElementById('convBtn');if(cb)cb.onclick=startConvHub;
  renderReset();
}
function renderReset(){
  const z=document.getElementById('resetZone');if(!z)return;
  z.innerHTML=`<button class="reset-btn" id="resetBtn">🧹 Limpar todo o progresso</button>`;
  document.getElementById('resetBtn').onclick=()=>{
    z.innerHTML=`<div class="reset-warn"><p>⚠️ <b>Tem certeza?</b> Isto apaga as missões cumpridas, as frases salvas e os dias seguidos. Não dá para desfazer.</p>
      <button class="btn-danger" id="rYes">Sim, apagar tudo</button>
      <button class="btn-cancel" id="rNo">Cancelar</button></div>`;
    document.getElementById('rNo').onclick=renderReset;
    document.getElementById('rYes').onclick=()=>{S={done:{},srs:{},streak:{last:null,count:0},best:{},conv:{}};save();goHome();};
  };
}

/* ===== MISSION FLOW =====
   steps: intro → dialogue → discovery(s) → produce(think cards) → drill → done */
function startMission(i){
  MI=i;VIEW='mission';
  const m=MISSIONS[i];
  STEPS=[];
  STEPS.push({k:'intro'});
  STEPS.push({k:'dialogue'});
  (m.discovery||[]).forEach((d,di)=>STEPS.push({k:'discovery',di}));
  (m.produce||[]).forEach((p,pi)=>STEPS.push({k:'think',pi}));
  STEPS.push({k:'drillIntro'});
  (m.drill||[]).forEach((d,di)=>STEPS.push({k:'drill',di}));
  STEPS.push({k:'done'});
  STEP=0;
  DRILL_SCORE={right:0,total:0};
  renderStep();
}
let DRILL_SCORE={right:0,total:0};
function nextStep(){STEP++;if(STEP>=STEPS.length){goHome();return;}renderStep();}
function renderStep(){
  window.scrollTo(0,0);if(synth)synth.cancel();
  const m=MISSIONS[MI];
  const st=STEPS[STEP];
  const pct=Math.round(STEP/(STEPS.length-1)*100);
  setBar('Missão '+m.n+' · '+m.title,true,pct);
  hideFoot();
  if(st.k==='intro')renderIntro(m);
  else if(st.k==='dialogue')renderDialogue(m);
  else if(st.k==='discovery')renderDiscovery(m,st.di);
  else if(st.k==='think')renderThink(m.produce[st.pi],st.pi,m.produce.length,false);
  else if(st.k==='drillIntro')renderDrillIntro(m);
  else if(st.k==='drill')renderDrill(m,st.di);
  else if(st.k==='done')renderDone(m);
}

/* ---- intro ---- */
function renderIntro(m){
  app.innerHTML=`<div class="step-wrap">
    <div class="mission-hero reveal">
      <div class="em">${m.emoji}</div>
      <h2>${m.title}</h2>
      <div class="s">${m.sub}</div>
    </div>
    <div class="cando reveal" style="animation-delay:.08s">
      <div class="k">Ao final desta missão, você vai conseguir</div>
      <ul>${m.cando.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  </div>`;
  showFoot('Começar a missão 🌸',nextStep,true);
}

/* ---- dialogue ---- */
function renderDialogue(m){
  const d=m.dialogue;
  const lines=d.lines.map((l,li)=>`
    <div class="line" id="ln${li}">
      <span class="who">${l.who}</span>
      <span class="ct"><span class="en">${l.en}</span><span class="pt">${l.pt}</span></span>
      <button class="spk" data-li="${li}" aria-label="Ouvir">${SVG.spk}</button>
    </div>`).join('');
  app.innerHTML=`<div class="step-wrap">
    <div class="step-tag">Passo 1 · Ouça a conversa</div>
    <div class="step-title">${d.title}</div>
    <div class="step-lead">Primeiro só ouça, sem se preocupar em entender tudo. Depois ouça de novo lendo. O ouvido vem antes da gramática.</div>
    <div class="dlg" id="dlgBox">
      <button class="play-all" id="playAll">${SVG.play} Ouvir a conversa inteira</button>
      ${lines}
      <button class="pt-toggle" id="ptToggle">Esconder tradução</button>
    </div>
  </div>`;
  const box=document.getElementById('dlgBox');
  document.getElementById('ptToggle').onclick=function(){
    box.classList.toggle('hide-pt');
    this.textContent=box.classList.contains('hide-pt')?'Mostrar tradução':'Esconder tradução';
  };
  app.querySelectorAll('[data-li]').forEach(b=>b.onclick=()=>{
    const li=+b.getAttribute('data-li');
    highlight(li);speak(d.lines[li].en);
  });
  document.getElementById('playAll').onclick=()=>playAll(d.lines,0);
  function highlight(li){
    app.querySelectorAll('.line').forEach(x=>x.classList.remove('hl'));
    const el=document.getElementById('ln'+li);if(el)el.classList.add('hl');
  }
  function playAll(ls,i){
    if(i>=ls.length){app.querySelectorAll('.line').forEach(x=>x.classList.remove('hl'));return;}
    highlight(i);
    speak(ls[i].en,()=>setTimeout(()=>playAll(ls,i+1),350));
  }
  showFoot('Entendi a conversa →',nextStep);
}

/* ---- discovery ---- */
function renderDiscovery(m,di){
  const d=m.discovery[di];
  const exs=(d.examples||[]).map(e=>`
    <div class="ex"><div class="txt"><span class="e">${e.en}</span><span class="p">${e.pt}</span></div>
    <button class="spk" data-say="${e.en.replace(/"/g,'')}">${SVG.spk}</button></div>`).join('');
  app.innerHTML=`<div class="step-wrap">
    <div class="step-tag">Passo 2 · A descoberta</div>
    <div class="step-title">${d.title}</div>
    <div class="disc ${d.warn?'warn':''} reveal">
      <p>${d.body}</p>
      ${exs}
    </div>
  </div>`;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.getAttribute('data-say')));
  showFoot('Entendi! Agora quero falar →',nextStep);
}

/* ---- think (Pimsleur anticipation) ---- */
function renderThink(p,idx,total,isReview,onAnswer){
  app.innerHTML=`<div class="step-wrap">
    <div class="ex-card reveal">
      <div class="ex-count">${isReview?'Revisão':'Sua vez de falar'} · ${idx+1} de ${total}</div>
      <div class="ex-prompt">Como você diria em inglês:</div>
      <div class="think-q">“${p.pt}”</div>
      <div class="think-hint">Pense na resposta — pode falar em voz alta! Errar faz parte: é assim que o cérebro grava. 💪</div>
      <div id="thinkReveal"></div>
    </div>
  </div>`;
  showFoot('Pensei! Mostrar resposta',()=>{
    document.getElementById('thinkReveal').innerHTML=`
      <div class="think-answer reveal">
        <span class="en">${p.en}</span>
        <button class="spk-big" id="sayBtn">${SVG.spk}</button>
      </div>
      <div class="think-hint">Ouça e repita em voz alta. Como foi?</div>
      <div class="self-row reveal">
        <button class="self-btn yes" id="selfYes">✓ Acertei</button>
        <button class="self-btn no" id="selfNo">Ainda não</button>
      </div>`;
    hideFoot();
    speak(p.en);
    document.getElementById('sayBtn').onclick=()=>speak(p.en);
    const fin=(ok)=>{
      if(onAnswer)onAnswer(ok);
      else nextStep();
    };
    document.getElementById('selfYes').onclick=()=>fin(true);
    document.getElementById('selfNo').onclick=()=>fin(false);
  },false);
}

/* ---- drill intro ---- */
function renderDrillIntro(m){
  app.innerHTML=`<div class="step-wrap">
    <div class="mission-hero reveal">

/* ---- drill exercises ---- */
function renderDrill(m,di){
  const ex=m.drill[di];
  const count=`Exercício ${di+1} de ${m.drill.length}`;
  if(ex.type==='mc')renderMC(ex,count);
  else if(ex.type==='listen')renderListen(ex,count);
  else if(ex.type==='build')renderBuild(ex,count);
}
function drillNext(ok){
  DRILL_SCORE.total++;if(ok)DRILL_SCORE.right++;
  setTimeout(nextStep,ok?850:1600);
}
function renderMC(ex,count){
  app.innerHTML=`<div class="step-wrap"><div class="ex-card reveal">
    <div class="ex-count">${count}</div>
    <div class="ex-prompt">${ex.prompt}</div>
    ${ex.sub?`<div class="ex-sub">${ex.sub}</div>`:''}
    <div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
    <div id="fb"></div>
  </div></div>`;
  hideFoot();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.getAttribute('data-i');const ok=i===ex.answer;
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    b.classList.add(ok?'sel-right':'sel-wrong');
    if(!ok)app.querySelector(`[data-i="${ex.answer}"]`).classList.add('show-right');
    document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ Isso!':'Quase!'} ${ex.why||''}</div>`;
    if(ex.say)speak(ex.say);
    drillNext(ok);
  });
}
function renderListen(ex,count){
  app.innerHTML=`<div class="step-wrap"><div class="ex-card reveal">
    <div class="ex-count">${count}</div>
    <div class="ex-prompt">O que você ouviu?</div>
    <div class="ex-sub">Toque para ouvir quantas vezes quiser.</div>
    <button class="listen-big" id="lBig">${SVG.spk}</button>
    <div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
    <div id="fb"></div>
  </div></div>`;
  hideFoot();
  const play=()=>speak(ex.audio);
  document.getElementById('lBig').onclick=play;
  setTimeout(play,450);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.getAttribute('data-i');const ok=i===ex.answer;
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    b.classList.add(ok?'sel-right':'sel-wrong');
    if(!ok)app.querySelector(`[data-i="${ex.answer}"]`).classList.add('show-right');
    document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ Ouvido afiado!':'Quase!'} ${ex.why||''}</div>`;
    drillNext(ok);
  });
}
function renderBuild(ex,count){
  const target=ex.words.join(' ');
  const shuffled=[...ex.words].map((w,i)=>({w,i})).sort(()=>Math.random()-.5);
  let picked=[];
  app.innerHTML=`<div class="step-wrap"><div class="ex-card reveal">
    <div class="ex-count">${count}</div>
    <div class="ex-prompt">Monte a frase:</div>
    <div class="ex-sub">“${ex.pt}”</div>
    <div class="build-zone" id="zone"></div>
    <div class="chips" id="chips">${shuffled.map((o,si)=>`<button class="chip" data-si="${si}" data-w="${o.w}">${o.w}</button>`).join('')}</div>
    <div id="fb"></div>
  </div></div>`;
  hideFoot();
  const zone=document.getElementById('zone');
  function redraw(){
    zone.innerHTML=picked.map((p,pi)=>`<button class="chip in" data-pi="${pi}">${p.w}</button>`).join('');
    zone.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{
      const pi=+b.getAttribute('data-pi');
      const item=picked.splice(pi,1)[0];
      document.querySelector(`[data-si="${item.si}"]`).classList.remove('used');
      redraw();check(false);
    });
  }
  function check(final){
    const cur=picked.map(p=>p.w).join(' ');
    if(picked.length===ex.words.length){
      const ok=cur===target;
      zone.classList.add(ok?'ok':'bad');
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ Perfeito!':'Quase! O certo é:'} <b>${target}</b></div>`;
      speak(target);
      app.querySelectorAll('.chip').forEach(c=>c.style.pointerEvents='none');
      drillNext(ok);
    }
  }
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('used'))return;
    b.classList.add('used');
    picked.push({w:b.getAttribute('data-w'),si:+b.getAttribute('data-si')});
    zone.classList.remove('ok','bad');
    redraw();check(true);
  });
}

/* ===== REVIEW SESSION ===== */
let RQ=[];let RI=0;let RSCORE={right:0,total:0};
function startReview(){
  RQ=srsDue();if(!RQ.length){goHome();return;}
  RQ.sort(()=>Math.random()-.5);
  if(RQ.length>15)RQ=RQ.slice(0,15);
  RI=0;RSCORE={right:0,total:0};VIEW='review';
  reviewStep();
}
function reviewStep(){
  window.scrollTo(0,0);
  if(RI>=RQ.length){reviewDone();return;}
  const id=RQ[RI];const p=phraseById(id);
  if(!p){RI++;reviewStep();return;}
  setBar('Revisão de hoje',true,Math.round(RI/RQ.length*100));
  renderThink(p,RI,RQ.length,true,(ok)=>{
    srsAnswer(id,ok);
    RSCORE.total++;if(ok)RSCORE.right++;
    RI++;reviewStep();
  });
}
function reviewDone(){
  bumpStreak();save();
  setBar('Revisão de hoje',true,100);
  const pct=RSCORE.total?Math.round(RSCORE.right/RSCORE.total*100):100;
  app.innerHTML=`<div class="step-wrap">
    <div class="done-hero">
      <span class="flower">🌱</span>
      <h2>Revisão concluída!</h2>
      <div class="s">Cada revisão deixa as frases mais firmes na memória.<br>Amanhã tem mais um pouquinho.</div>
      <div class="result-ring" style="--pct:${pct}"><span class="n">${pct}%</span><span class="l">de acerto</span></div>
    </div>
  </div>`;
  confetti();
  showFoot('Voltar ao caminho 🌸',goHome,true);
}

/* ===== CONFETTI ===== */
function confetti(){
  const colors=['#E8537A','#D9A441','#3D8B66','#F5B8C9','#FBF3E2'];
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<36;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.7)+'s';
    p.style.transform='translateY(-10vh)';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),3500);
}

      <h2>${CONV.title}</h2>
      <div class="s">${CONV.setup}</div>
      <div class="who-am-i">🎭 Nesta conversa, você é <b>${CONV.you}</b>.<br>${CONV.role}</div>
    </div>
  </div>`;
  showFoot('Começar a conversa 💬',()=>{CTURN=0;renderConvTurn();},true);
}

/* cada item de CONV.turns:
   {them:{en,pt}}  -> fala do outro (bolha esquerda + áudio)
   {you:{pt,en,hint}} -> sua vez: mostra a tarefa em PT, você revela o EN
   pode vir em sequência; renderConvTurn processa um "você" por tela,
   exibindo todas as falas "them" acumuladas antes dele */
function renderConvTurn(){
  window.scrollTo(0,0);if(synth)synth.cancel();
  const pct=Math.round(CTURN/CONV.turns.length*100);
  setBar(CONV.title,true,pct);hideFoot();

  // montar bolhas até o próximo "you"
  let i=CTURN;
  const pending=[];
  while(i<CONV.turns.length && CONV.turns[i].them){
    pending.push(CONV.turns[i].them);i++;
  }
  const youTurn=(i<CONV.turns.length)?CONV.turns[i].you:null;
  const youIndex=i;

  // render histórico + pending
  const chat=CHIST.concat(pending.map(t=>({who:'them',en:t.en,pt:t.pt})));
  let html=`<div class="step-wrap"><div class="chat-area" id="chatArea">`;
  html+=chat.map(b=>bubbleHTML(b)).join('');
  html+=`</div><div id="turnZone"></div></div>`;
  app.innerHTML=html;
  bindBubbleAudio();

  // tocar a última fala "them" automaticamente
  if(pending.length){
    const last=pending[pending.length-1];
    setTimeout(()=>speak(last.en),350);
  }

  // commit pending ao histórico
  CHIST=chat;

  if(!youTurn){
    // acabou
    CTURN=youIndex;
    renderConvDone();return;
  }

  // mostrar "sua vez"
  const tz=document.getElementById('turnZone');
  tz.innerHTML=`<div class="your-turn reveal">
    <div class="lbl">Sua vez de responder</div>
    <div class="task">Como você diria: “${youTurn.pt}”</div>
    <div class="hint">${youTurn.hint||'Pense e fale em voz alta. Depois confira.'}</div>
    <div id="revealZone"></div>
  </div>`;
  showFoot('Pensei! Mostrar resposta',()=>{
    document.getElementById('revealZone').innerHTML=`
      <div class="reveal-ans reveal">
        <span class="en">${youTurn.en}</span>
        <span class="pt">${youTurn.pt}</span>
        <button class="spk-big" id="cSay">${SVG.spk}</button>
      </div>
      <div class="hint" style="text-align:center;margin-top:10px">Ouça e repita. Você chegou perto?</div>
      <div class="self-row reveal" style="margin-top:12px">
        <button class="self-btn yes" id="cYes">✓ Acertei!</button>
        <button class="self-btn no" id="cNo">Quase</button>
      </div>`;
    hideFoot();
    speak(youTurn.en);
    document.getElementById('cSay').onclick=()=>speak(youTurn.en);
    const advance=(ok)=>{
      CSCORE.total++;if(ok)CSCORE.right++;
      // adiciona a fala da Haruko ao histórico
      CHIST.push({who:'me',en:youTurn.en,pt:youTurn.pt});
      CTURN=youIndex+1;
      renderConvTurn();
    };
    document.getElementById('cYes').onclick=()=>advance(true);
    document.getElementById('cNo').onclick=()=>advance(false);
  },true);
}
function bubbleHTML(b){
  if(b.who==='me'){
    return `<div class="bubble me"><span class="en">${b.en}</span><span class="pt">${b.pt}</span></div>`;
  }
  return `<div class="bubble them"><span class="en">${b.en}</span><span class="pt">${b.pt}</span>
    <button class="spk-inline" data-say="${b.en.replace(/"/g,'')}">${SVG.spk} ouvir</button></div>`;
}
function bindBubbleAudio(){
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.getAttribute('data-say')));
}
function renderConvDone(){
  if(!S.conv)S.conv={};
  S.conv[CONV.id]=true;bumpStreak();save();
  const pct=CSCORE.total?Math.round(CSCORE.right/CSCORE.total*100):100;
  setBar(CONV.title,true,100);
  app.innerHTML=`<div class="step-wrap">
    <div class="done-hero">
      <span class="flower">💬</span>
      <h2>Conversa concluída!</h2>
      <div class="s">${CONV.title} — você conversou do início ao fim em inglês. Isso é fluência nascendo.</div>
      <div class="result-ring" style="--pct:${pct}"><span class="n">${pct}%</span><span class="l">de acerto</span></div>
    </div>
    <div class="srs-note reveal" style="animation-delay:.1s">🌱 <span>Quanto mais você conversa, mais natural fica. Volte a esta conversa em alguns dias — vai sair muito mais solto!</span></div>
  </div>`;
  confetti();
  showFoot('Voltar às conversas 💬',startConvHub,true);
}

   examples:[

    {en:"I can't drive.",pt:"Eu não sei dirigir."},
    {en:"I cook very well.",pt:"Eu cozinho muito bem."}

 discovery:[

   body:"Lembra que <span class=\"en\">I'm</span> serve para ser e estar? No passado, o trabalho é do <span class=\"en\">was</span>: <span class=\"en\">I was tired</span> (eu estava cansada), <span class=\"en\">It was wonderful</span> (foi maravilhoso). Para <span class=\"en\">you</span> e <span class=\"en\">they</span>, vira <span class=\"en\">were</span>: <span class=\"en\">you were</span>, <span class=\"en\">they were</span>.",
   examples:[
    {en:"I was at home.",pt:"Eu estava em casa."},
    {en:"It was wonderful!",pt:"Foi maravilhoso!"},
    {en:"They were so happy!",pt:"Eles estavam tão felizes!"}
   ]},
  {title:"How was it? — perguntando como foi",
   body:"<span class=\"en\">How was it?</span> = como foi? A resposta: <span class=\"en\">It was + adjetivo</span>: wonderful, delicious, beautiful. E as palavras do ontem: <span class=\"en\">yesterday</span> (ontem), <span class=\"en\">last night</span> (ontem à noite). <span class=\"en\">Where were you?</span> = onde você estava?",
   examples:[
    {en:"How was it?",pt:"Como foi?"},
    {en:"Where were you yesterday?",pt:"Onde você estava ontem?"},
    {en:"The food was delicious!",pt:"A comida estava deliciosa!"}
   ]}
 ],

/* ===== MISSÃO 18 ===== */
{id:"m18",n:18,level:3,emoji:"📖",
 title:"O que eu fiz",
 sub:"O passado mágico do -ed",
 cando:[
  "Contar o que fez: I worked, I cooked, I cleaned",
  "Usar a pergunta de ouro: What did you do yesterday?",
  "Narrar seu dia de ontem inteiro"
 ],
 dialogue:{
  title:"Meu dia ontem",
  lines:[
   {who:"A",en:"What did you do yesterday?",pt:"O que você fez ontem?"},
   {who:"B",en:"I worked in the morning.",pt:"Trabalhei de manhã."},
   {who:"A",en:"And then?",pt:"E depois?"},
   {who:"B",en:"I cooked lunch and I cleaned the house.",pt:"Cozinhei o almoço e limpei a casa."},
   {who:"A",en:"Busy day!",pt:"Dia cheio!"},
   {who:"B",en:"Yes! At night I watched TV and relaxed.",pt:"Sim! À noite assisti TV e relaxei."}
  ]},
 discovery:[
  {title:"O truque do -ed: o passado de quase tudo",
   body:"Pega o verbo que você já sabe e cola um <span class=\"en\">-ed</span>: <span class=\"en\">work → worked</span> (trabalhei), <span class=\"en\">cook → cooked</span> (cozinhei), <span class=\"en\">clean → cleaned</span> (limpei), <span class=\"en\">watch → watched</span> (assisti), <span class=\"en\">walk → walked</span> (caminhei). E o melhor: é igual para todo mundo — I worked, she worked, they worked.",
   examples:[
    {en:"I worked in the morning.",pt:"Trabalhei de manhã."},
    {en:"I cooked lunch.",pt:"Cozinhei o almoço."},
    {en:"I cleaned the house.",pt:"Limpei a casa."}
   ]},
  {title:"A pergunta de ouro do passado",
   body:"Decore como uma frase só: <span class=\"en\">What did you do yesterday?</span> = o que você fez ontem? É a pergunta que abre qualquer conversa sobre o passado. Troque o final: <span class=\"en\">...last night?</span> (ontem à noite), <span class=\"en\">...last weekend?</span> (no fim de semana).",
   examples:[
    {en:"What did you do yesterday?",pt:"O que você fez ontem?"},
    {en:"What did you do last weekend?",pt:"O que você fez no fim de semana?"},
    {en:"Busy day!",pt:"Dia cheio!"}
   ]},
  {title:"O som do -ed — o segredo que ninguém conta",
   body:"Atenção ao ouvido: o -ed quase nunca soa \"éd\"! <span class=\"en\">worked</span> soa \"workt\", <span class=\"en\">cooked</span> soa \"cookt\", <span class=\"en\">cleaned</span> soa \"cleend\" — tudo numa sílaba só, rapidinho no final. Ele só vira uma sílaba extra depois de som de T ou D: <span class=\"en\">visited</span> = \"visit-ed\", <span class=\"en\">needed</span> = \"need-ed\". Toque nos exemplos e repare na diferença:",
   examples:[
    {en:"worked",pt:"soa \"workt\" — 1 sílaba"},
    {en:"cleaned",pt:"soa \"cleend\" — 1 sílaba"},
    {en:"visited",pt:"soa \"visit-ed\" — aqui sim tem o \"ed\""}
   ]}
 ],

   ]}

 title:"No médico",
 sub:"Dizer o que dói e entender o doutor",

 dialogue:{
  title:"Na consulta",
  lines:[
   {who:"Dr",en:"Good morning! What's the problem?",pt:"Bom dia! Qual é o problema?"},
   {who:"B",en:"I have a headache. And my back hurts.",pt:"Estou com dor de cabeça. E minhas costas doem."},
   {who:"Dr",en:"Since when?",pt:"Desde quando?"},
   {who:"B",en:"Since yesterday. I feel tired.",pt:"Desde ontem. Me sinto cansada."},
   {who:"Dr",en:"Do you sleep well?",pt:"Você dorme bem?"},
   {who:"B",en:"No, I don't.",pt:"Não."},
   {who:"Dr",en:"Take this medicine and rest, OK?",pt:"Tome este remédio e descanse, tá?"},
   {who:"B",en:"Thank you, doctor!",pt:"Obrigada, doutor!"}
  ]},
 discovery:[

   body:"Fórmula 1: <span class=\"en\">I have a + dor</span>: <span class=\"en\">I have a headache</span> (dor de cabeça). Fórmula 2: <span class=\"en\">my + parte + hurts</span>: <span class=\"en\">my back hurts</span> (minhas costas doem), <span class=\"en\">my leg hurts</span> (minha perna dói). Com as duas, você descreve qualquer dor do corpo.",
   examples:[
    {en:"I have a headache.",pt:"Estou com dor de cabeça."},
    {en:"My back hurts.",pt:"Minhas costas doem."},
    {en:"My leg hurts.",pt:"Minha perna dói."}
   ]},
  {title:"I feel + desde quando + a receita",
   body:"<span class=\"en\">I feel tired</span> = me sinto cansada (feel = sentir). <span class=\"en\">since yesterday</span> = desde ontem. E as instruções do médico: <span class=\"en\">Take this medicine</span> (tome este remédio) e <span class=\"en\">rest</span> (descanse). <span class=\"en\">What's the problem?</span> = qual é o problema?",
   examples:[
    {en:"I feel tired.",pt:"Me sinto cansada."},
    {en:"since yesterday",pt:"desde ontem"},
    {en:"Take this medicine and rest.",pt:"Tome este remédio e descanse."}
   ]}
 ],

{id:"m29",n:29,level:4,emoji:"⚖️",
 title:"Melhor e maior",
 sub:"Comparar: bigger, cheaper, better",
 cando:[

  "Usar o especial: better / the best",
  "Perguntar o porquê: Why?"
 ],
 dialogue:{
  title:"Qual mercado é melhor?",
  lines:[
   {who:"A",en:"This market is good.",pt:"Este mercado é bom."},
   {who:"B",en:"Yes, but that market is better.",pt:"Sim, mas aquele é melhor."},
   {who:"A",en:"Better? Why?",pt:"Melhor? Por quê?"},
   {who:"B",en:"It's bigger and cheaper!",pt:"É maior e mais barato!"},
   {who:"A",en:"And the fruit?",pt:"E a fruta?"},
   {who:"B",en:"The fruit there is fresher. The best in town!",pt:"A fruta lá é mais fresca. A melhor da cidade!"}
  ]},
 discovery:[
  {title:"O -er da comparação",
   body:"Para comparar, cola um <span class=\"en\">-er</span> no adjetivo: <span class=\"en\">big → bigger</span> (maior), <span class=\"en\">cheap → cheaper</span> (mais barato), <span class=\"en\">fresh → fresher</span> (mais fresco), <span class=\"en\">old → older</span> (mais velho). Igual ao -ed do passado: uma regrinha, mil usos.",
   examples:[
    {en:"It's bigger.",pt:"É maior."},
    {en:"It's cheaper!",pt:"É mais barato!"},
    {en:"The fruit is fresher.",pt:"A fruta é mais fresca."}
   ]},
  {title:"Good vira better — o rebelde da comparação",
   body:"<span class=\"en\">good</span> (bom) não aceita -er: vira <span class=\"en\">better</span> (melhor). E o campeão de todos: <span class=\"en\">the best</span> (o melhor): <span class=\"en\">The best in town!</span> (o melhor da cidade!). Para perguntar o motivo: <span class=\"en\">Why?</span> (por quê?). <span class=\"en\">this/that</span> = este/aquele.",
   examples:[
    {en:"That market is better.",pt:"Aquele mercado é melhor."},
    {en:"The best in town!",pt:"O melhor da cidade!"},
    {en:"Why?",pt:"Por quê?"}
   ]}
 ],

 ],
 dialogue:{
  title:"O encontro inesperado",
  lines:[
   {who:"A",en:"Tell me about your day!",pt:"Me conta seu dia!"},
   {who:"B",en:"OK! When I was walking to the market, I saw an old friend!",pt:"Tá! Quando eu estava indo ao mercado, vi uma velha amiga!"},
   {who:"A",en:"No way! Who?",pt:"Não acredito! Quem?"},
   {who:"B",en:"Rosa! While we were talking, it started to rain!",pt:"A Rosa! Enquanto a gente conversava, começou a chover!"},
   {who:"A",en:"And then?",pt:"E aí?"},
   {who:"B",en:"After that, we ran to a café. We talked for two hours!",pt:"Depois disso, corremos pra um café. Conversamos por duas horas!"},
   {who:"A",en:"What a day!",pt:"Que dia!"},
   {who:"B",en:"Finally, the sun came back. A perfect afternoon!",pt:"No fim, o sol voltou. Uma tarde perfeita!"}
  ]},
 discovery:[
  {title:"O passado com cena: was/were + -ing",
   body:"Para pintar a CENA de uma história: <span class=\"en\">When I was walking to the market...</span> (quando eu estava indo ao mercado...) — was + -ing mostra o que estava rolando quando algo aconteceu. <span class=\"en\">While we were talking, it started to rain</span> (enquanto conversávamos, começou a chover). <span class=\"en\">while</span> = enquanto.",
   examples:[

   ]},

   body:"<span class=\"en\">After that</span> = depois disso. <span class=\"en\">Finally</span> = no fim / finalmente. <span class=\"en\">for two hours</span> = por duas horas. E as reações de boa ouvinte: <span class=\"en\">No way!</span> (não acredito!), <span class=\"en\">And then?</span> (e aí?), <span class=\"en\">What a day!</span> (que dia!).",

    {en:"No way!",pt:"Não acredito!"}
   ]}

   ]},
  {title:"don't you? — o né dos verbos",
   body:"Com verbo de ação, o né usa o do: <span class=\"en\">You like coffee, don't you?</span> (você gosta de café, né?), <span class=\"en\">She works here, doesn't she?</span> E a resposta enfática: <span class=\"en\">It really is!</span> (é mesmo!). Esse detalhe é o que separa quem ESTUDA inglês de quem FALA inglês.",
   examples:[
