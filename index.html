/* ============================================================
   TREINO: injeta uma seção de treino de vocabulário em cada
   capítulo (logo antes do quiz). Gera questões a partir do
   próprio vocabulário do capítulo — prática praticamente sem fim.
   ============================================================ */
COURSE.forEach(c=>{
  if(!c.sections.some(s=>s.type==='vocab'))return;
  if(c.sections.some(s=>s.type==='drill'))return;
  const qi=c.sections.findIndex(s=>s.type==='quiz');
  const drill={type:'drill',icon:'🔁',label:'Treino do vocabulário',desc:'Pratique todas as palavras — sempre embaralhado'};
  if(qi>=0)c.sections.splice(qi,0,drill);else c.sections.push(drill);
});

/* ============================================================
   PROGRESS
   ============================================================ */
const KEY="eng_a1_course";
let progress=Store.get(KEY,{});
function P(id){if(!progress[id])progress[id]={sections:{},quizScore:0,complete:false};return progress[id];}
function save(){Store.set(KEY,progress);}
function chapComplete(i){return !!(progress[COURSE[i].id]&&progress[COURSE[i].id].complete);}
function chapUnlocked(i){return !COURSE[i].soon;} /* tudo aberto: ela navega onde quiser */
function coursePct(){const ready=COURSE.filter(c=>!c.soon);const done=ready.filter((c,idx)=>progress[c.id]&&progress[c.id].complete).length;return ready.length?Math.round(done/ready.length*100):0;}
function chapPct(i){const c=COURSE[i];const secs=c.sections.length;if(!secs)return 0;const pr=P(c.id);const done=c.sections.filter((s,si)=>pr.sections[si]).length;return Math.round(done/secs*100);}

/* ===== DOM ===== */
const app=document.getElementById('app'),topbar=document.getElementById('topbar'),barTitle=document.getElementById('barTitle'),
  backBtn=document.getElementById('backBtn'),footer=document.getElementById('footer'),footerInner=document.getElementById('footerInner'),
  pbarFill=document.getElementById('pbarFill'),slowToggle=document.getElementById('slowToggle');
slowToggle.onclick=()=>{slowMode=!slowMode;slowToggle.classList.toggle('on',slowMode);};
function setBar(t,b){barTitle.textContent=t;topbar.classList.toggle('has-back',!!b);}
function setProgressBar(p){pbarFill.style.width=p+"%";}
function showFooter(h){footer.style.display='block';footerInner.innerHTML=h;}
function hideFooter(){footer.style.display='none';footerInner.innerHTML='';}
app.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){ring(b);speak(b.getAttribute('data-say'),{slow:b.hasAttribute('data-slow')});}});

/* ===== NAVIGATION ===== */
let LEVEL='course',CUR=0,SEC=0;
backBtn.onclick=()=>{if(LEVEL==='section')openChapter(CUR);else goCourse();};
function goCourse(){LEVEL='course';window.scrollTo(0,0);hideFooter();renderCourse();}
function openChapter(i){LEVEL='chapter';CUR=i;window.scrollTo(0,0);hideFooter();renderChapter();}
function openSection(si){LEVEL='section';SEC=si;window.scrollTo(0,0);hideFooter();renderSection();}

/* ===== COURSE HOME ===== */
function renderCourse(){
  setBar("Inglês da Haruko 💙",false);setProgressBar(coursePct());
  const doneN=COURSE.filter((c,i)=>!c.soon&&chapComplete(i)).length;
  const total=COURSE.filter(c=>!c.soon).length;
  const makeCard=(c,i)=>{
    const done=chapComplete(i),unlocked=chapUnlocked(i),soon=!!c.soon;
    const cls=done?'done':(soon?'soon':(unlocked?'':'locked'));
    let mark;
    if(done)mark=`<span class="circle done">${SVG.check}</span>`;
    else if(soon)mark=`<span class="pill">Em breve</span>`;
    else if(!unlocked)mark=`<span class="circle lock">${SVG.lock}</span>`;
    else mark=`<span class="circle"></span>`;
    return `<button class="ch-card ${cls} reveal" style="animation-delay:${0.04*i+0.1}s" data-ch="${i}" ${(!unlocked&&!done)?'data-locked="1"':''}><span class="ch-num">${c.n}</span><span class="ch-body"><span class="t">${c.title}</span><span class="s">${c.sub}</span></span><span class="ch-mark">${mark}</span></button>`;
  };
  const a1Cards=COURSE.slice(0,12).map((c,i)=>makeCard(c,i)).join('');
  const a2Cards=COURSE.slice(12).map((c,i)=>makeCard(c,i+12)).join('');
  const a1Done=COURSE.slice(0,12).filter((c,i)=>chapComplete(i)).length;
  const a2Done=COURSE.slice(12).filter((c,i)=>chapComplete(i+12)).length;
  app.innerHTML=`
    <div class="hero reveal">
      <span class="hero-tag">● A1 + A2 · Básico Completo</span>
      <h1>Inglês da <span class="accent">Haruko</span> 💙</h1>
    </div>
    <div class="cando reveal" style="animation-delay:.08s">
      <div class="k">Seu progresso</div>
      <p><b>${doneN} de ${total}</b> capítulos concluídos. Você pode estudar na ordem que quiser — passe no quiz (80%) para ganhar o ✓ verde.</p>
    </div>
    <div class="section-label reveal" style="animation-delay:.12s">🔤 A1 — Iniciante &nbsp;<span style="font-weight:400;opacity:.55">${a1Done}/12 ✓</span></div>
    ${a1Cards}
    <div class="section-label reveal" style="animation-delay:.56s;margin-top:22px">📈 A2 — Básico Avançado &nbsp;<span style="font-weight:400;opacity:.55">${a2Done}/12 ✓</span></div>
    ${a2Cards}
    <div class="muted-note reveal" style="animation-delay:.96s">Toque em qualquer 🔊 para ouvir. Use <b>Devagar</b> lá em cima para os sons difíceis.</div>
    <div class="reset-zone reveal" id="resetZone" style="animation-delay:1.02s"></div>`;
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
    const i=+b.getAttribute('data-ch');if(COURSE[i].soon){wiggle(b);return;}openChapter(i);
  });
  renderResetZone();
}
function renderResetZone(){
  const z=document.getElementById('resetZone');if(!z)return;
  z.innerHTML=`<button class="reset-btn" id="resetBtn">🧹 Limpar progresso</button>`;
  document.getElementById('resetBtn').onclick=()=>{
    z.innerHTML=`<div class="reset-warn">
      <p>⚠️ <b>Tem certeza?</b> Isto apaga TODOS os ✓ e zera a barra de progresso de todos os capítulos. Não dá pra desfazer.</p>
      <button class="btn-danger" id="resetYes">Sim, apagar tudo</button>
      <button class="btn-cancel" id="resetNo">Não, cancelar</button></div>`;
    document.getElementById('resetNo').onclick=()=>renderResetZone();
    document.getElementById('resetYes').onclick=()=>{progress={};save();goCourse();};
  };
}
function wiggle(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300});}

/* ===== CHAPTER HOME ===== */
function renderChapter(){
  const c=COURSE[CUR];setBar("Capítulo "+c.n,true);setProgressBar(chapPct(CUR));
  const pr=P(c.id);
  const done=c.sections.filter((s,si)=>pr.sections[si]).length;
  const banner=pr.complete?`<div class="done-banner reveal"><span class="ic">${SVG.check}</span><span class="tx">Capítulo concluído! Você tirou ${pr.quizScore}% no quiz.</span></div>`:'';
  const cards=c.sections.map((s,si)=>`
    <button class="lesson-card reveal" style="animation-delay:${0.045*si+0.12}s" data-sec="${si}">
      <span class="lc-ico">${s.icon}</span>
      <span class="lc-body"><span class="t">${s.label}</span><span class="s">${s.desc}</span></span>
      <span class="lc-mark ${pr.sections[si]?'done':''}">${pr.sections[si]?SVG.check:''}</span>
    </button>`).join("");
  app.innerHTML=`
    <div class="hero reveal"><span class="hero-tag">● Capítulo ${c.n}</span><h1>${c.title}</h1></div>
    ${banner}
    <div class="cando reveal" style="animation-delay:.08s"><div class="k">Sua meta neste capítulo</div>
      <p>No fim, você vai conseguir ${c.goal}.</p></div>
    <div class="section-label reveal" style="animation-delay:.12s">As aulas · ${done}/${c.sections.length} concluídas</div>
    ${cards}<div class="spacer"></div>`;
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>openSection(+b.getAttribute('data-sec')));
}

/* ===== SECTION ROUTER ===== */
function curSec(){return COURSE[CUR].sections[SEC];}
function markSecDone(){P(COURSE[CUR].id).sections[SEC]=true;save();}
function nextLessonBtn(){return `<button class="btn" id="next">Concluir aula ${SVG.arrow}</button>`;}
function bindLessonNext(){document.getElementById('next').onclick=()=>{markSecDone();openChapter(CUR);};}
function renderSection(){
  const s=curSec();setBar(s.label,true);setProgressBar(chapPct(CUR));
  if(s.type==='alphabet_sounds')renderSounds(s,true);
  else if(s.type==='vocab')renderVocab(s);
  else if(s.type==='numbers')renderNumbers(s);
  else if(s.type==='phrases')renderPhrases(s);
  else if(s.type==='notes')renderNotes(s);
  else if(s.type==='dialogue')renderDialogue(s);
  else if(s.type==='drill')renderDrill();
  else if(s.type==='practice')renderPractice(0,0);
  else if(s.type==='quiz')renderQuiz(0,0);
}

/* ===== RENDERERS ===== */
function renderSounds(s,withAlpha){
  let html='';
  if(withAlpha){
    const letters=ALPHABET.map((l,i)=>`<button data-say="${LETTER_SOUNDS[l]}" class="reveal" style="animation-delay:${0.012*i}s">${l}</button>`).join("");
    html+=`<h2 class="title reveal">O alfabeto</h2>
      <p class="lead reveal" style="animation-delay:.05s">Toque em cada letra para ouvir o nome dela em inglês.</p>
      <div class="alpha">${letters}</div>`;
  }
  const sounds=s.sounds.map((x,i)=>`
    <div class="sound-card reveal" style="animation-delay:${0.05*i+0.1}s">
      <span class="big">${x.sym}</span>
      <span class="info"><span class="w">${x.words[0]} · ${x.words[1]}</span><span class="d">${x.note}</span></span>
      <button class="spk sm" data-say="${x.words[0]}. ${x.words[1]}." data-slow aria-label="Ouvir">${SVG.spk}</button>
    </div>`).join("");
  html+=`<h2 class="title reveal" style="animation-delay:.1s">${s.title}</h2>
    <p class="lead reveal" style="animation-delay:.14s">${s.intro}</p>${sounds}<div class="spacer"></div>`;
  app.innerHTML=html;showFooter(nextLessonBtn());bindLessonNext();
}
function vcard(v,delay){return `<div class="vocab-card reveal" style="animation-delay:${delay}s">
    <span class="vc-emoji">${v.em||'🔹'}</span>
    <span class="vc-text"><span class="vc-en">${v.e}</span><span class="vc-pt">${v.p}</span>${v.x?`<span class="vc-ex">${v.x}</span>`:''}</span>
    <button class="spk" data-say="${v.e.replace(/"/g,'').replace(/_+/g,'blank')}" aria-label="Ouvir">${SVG.spk}</button></div>`;}
function renderVocab(s){
  let html=`<h2 class="title reveal">${s.title}</h2><p class="lead reveal" style="animation-delay:.05s">${s.intro}</p>`;
  let d=0.08;
  s.groups.forEach(g=>{html+=`<div class="group-head reveal" style="animation-delay:${d}s"><span class="em">${g.emj}</span>${g.title}</div>`;
    g.items.forEach(v=>{d+=0.028;html+=vcard(v,d);});});
  html+=`<div class="spacer"></div>`;app.innerHTML=html;showFooter(nextLessonBtn());bindLessonNext();
}
function renderNumbers(s){
  const tiles=s.data.map((n,i)=>`<button class="num-tile reveal" data-say="${n[1]}" style="animation-delay:${0.022*i+0.05}s"><span class="d">${n[0]}</span><span class="w">${n[1]}</span></button>`).join("");
  app.innerHTML=`<h2 class="title reveal">${s.title}</h2><p class="lead reveal" style="animation-delay:.05s">${s.intro}</p>
    <div class="num-grid">${tiles}</div><div class="spacer"></div>`;
  showFooter(nextLessonBtn());bindLessonNext();
}
function renderPhrases(s){
  const cards=s.data.map((v,i)=>vcard(v,0.04*i+0.08)).join("");
  app.innerHTML=`<h2 class="title reveal">${s.title}</h2><p class="lead reveal" style="animation-delay:.05s">${s.intro}</p>${cards}<div class="spacer"></div>`;
  showFooter(nextLessonBtn());bindLessonNext();
}
function renderNotes(s){
  const cards=s.data.map((u,i)=>`<div class="use-card ${u.warn?'warn':''} reveal" style="animation-delay:${0.06*i+0.05}s">
      <h3><span class="emj">${u.emj}</span>${u.title}</h3><p>${u.html}</p>${u.table?gtable(u.table):''}</div>`).join("");
  app.innerHTML=`<h2 class="title reveal">${s.title}</h2><p class="lead reveal" style="animation-delay:.05s">${s.intro}</p>${cards}<div class="spacer"></div>`;
  showFooter(nextLessonBtn());bindLessonNext();
}
function gtable(rows){return `<div class="gtable">`+rows.map(r=>`<div class="row"><div>${r[0]}</div><div>${r[1]}${r[2]?`<span class="pt"> — ${r[2]}</span>`:''}</div></div>`).join("")+`</div>`;}
function renderDialogue(s){
  let html=`<h2 class="title reveal">${s.title}</h2><p class="lead reveal" style="animation-delay:.05s">${s.intro}</p>`;
  s.data.forEach((dlg,di)=>{
    const lines=dlg.lines.map((l,li)=>`<div class="line" id="d${di}l${li}" data-say="${l.en.replace(/"/g,'')}">
      <span class="who">${l.who}</span><span class="ct"><span class="en">${l.en}</span><span class="pt">${l.pt}</span></span>
      <button class="spk sm ghost" data-say="${l.en.replace(/"/g,'')}" aria-label="Ouvir">${SVG.spk}</button></div>`).join("");
    html+=`<div class="dlg-block reveal" style="animation-delay:${0.1*di+0.1}s">
      <div class="dlg-title"><span class="em">${dlg.emj}</span>${dlg.title}</div>
      <button class="play-all" data-play="${di}">${SVG.play} Ouvir a conversa inteira</button>
      <div class="dialogue" id="dlg${di}">${lines}</div>
      <button class="pt-toggle" data-toggle="${di}">👁️ Esconder a tradução</button></div>`;
  });
  html+=`<div class="spacer"></div>`;app.innerHTML=html;
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSequence(+b.getAttribute('data-play')));
  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=function(){const di=this.getAttribute('data-toggle');
    const d=document.getElementById('dlg'+di);const h=d.classList.toggle('hide-pt');this.textContent=h?'👁️ Mostrar a tradução':'👁️ Esconder a tradução';});
  showFooter(nextLessonBtn());bindLessonNext();
}
function playSequence(di){
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const lines=curSec().data[di].lines;
  lines.forEach((_,li)=>document.getElementById('d'+di+'l'+li)?.classList.remove('active'));
  let i=0;(function nx(){
    if(i>0)document.getElementById('d'+di+'l'+(i-1))?.classList.remove('active');
    if(i>=lines.length)return;
    const node=document.getElementById('d'+di+'l'+i);
    if(node){node.classList.add('active');node.scrollIntoView({behavior:'smooth',block:'center'});}
    const u=new SpeechSynthesisUtterance(lines[i].en);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=slowMode?0.72:0.9;
    u.onend=()=>{i++;setTimeout(nx,260);};u.onerror=()=>{i++;setTimeout(nx,260);};speechSynthesis.speak(u);
  })();
}

/* ===== EXERCISE FLOW ===== */
function renderFlow(cfg,idx,score){
  window.scrollTo(0,0);hideFooter();
  if(idx>=cfg.items.length)return cfg.onFinish(score);
  const item=cfg.items[idx];setBar(cfg.title,true);
  const dots=cfg.items.map((_,i)=>`<i class="${i<idx?'done':(i===idx?'on':'')}"></i>`).join("");
  app.innerHTML=`<div class="ex-head"><span class="ex-count">${idx+1} de ${cfg.items.length}</span><span class="ex-dots">${dots}</span></div><div id="exbody"></div>`;
  const body=document.getElementById('exbody');
  const advance=(correct,why)=>{const ns=score+(correct?1:0),last=idx===cfg.items.length-1;
    const label=last?(cfg.isQuiz?'Ver resultado':'Finalizar'):'Próximo';
    showFooter(feedback(correct,why)+`<button class="btn ${correct?'':'dark'}" id="next">${label} ${SVG.arrow}</button>`);
    document.getElementById('next').onclick=()=>renderFlow(cfg,idx+1,ns);};
  if(item.type==='mc'||item.type==='listen')renderMC(body,item,advance);
  else if(item.type==='order')renderOrder(body,item,advance);
  else if(item.type==='match')renderMatch(body,item,advance);
}
function feedback(correct,why){return `<div class="feedback ${correct?'good':'bad'}"><span class="fi">${correct?'🎉':'💡'}</span>
  <span class="ft">${correct?'<b>Muito bem!</b> ':'<b>Quase!</b> '}${why||''}</span></div>`;}
function renderMC(body,item,advance){
  const isListen=item.type==='listen';
  const hero=isListen?`<div class="q-audio-hero"><button class="big-spk" data-say="${item.audio.replace(/"/g,'')}" aria-label="Ouvir">${SVG.spk}</button><span class="hint">Toque para ouvir de novo</span></div>`:'';
  body.innerHTML=`<div class="q-prompt">${item.prompt}</div>${item.sub?`<div class="q-sub">${item.sub}</div>`:''}${hero}<div class="opts" id="opts"></div>`;
  if(isListen)setTimeout(()=>{const b=body.querySelector('.big-spk');ring(b);speak(item.audio);},350);
  const opts=document.getElementById('opts');
  item.opts.forEach((o,i)=>{const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML=`<span class="key">${String.fromCharCode(65+i)}</span><span>${o}</span>`;
    btn.onclick=()=>{const correct=i===item.answer;
      [...opts.children].forEach((c,ci)=>{c.setAttribute('disabled','');
        if(ci===item.answer)c.classList.add('correct');else if(ci===i)c.classList.add('wrong');else c.classList.add('dim');});
      if(!correct)speak((item.opts[item.answer]||'').replace(/<[^>]+>/g,''));advance(correct,item.why);};
    opts.appendChild(btn);});
}
function renderOrder(body,item,advance){
  const correctStr=item.words.join(' ');
  const shuffled=item.words.map((w,i)=>({w,i})).sort(()=>Math.random()-0.5);
  body.innerHTML=`<div class="q-prompt">${item.prompt}</div><div class="q-sub">${item.sub||''}</div>
    <div class="answer-row" id="ans"></div><div class="bank" id="bank"></div><button class="check-btn" id="check" disabled>Verificar</button>`;
  const ans=document.getElementById('ans'),bank=document.getElementById('bank'),check=document.getElementById('check');
  let placed=[];
  shuffled.forEach(obj=>{const t=document.createElement('button');t.className='tile';t.textContent=obj.w;t.dataset.i=obj.i;
    t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');placed.push(obj);renderAns();};bank.appendChild(t);});
  function renderAns(){ans.innerHTML='';placed.forEach((obj,pos)=>{const t=document.createElement('button');t.className='tile placed';t.textContent=obj.w;
    t.onclick=()=>{placed.splice(pos,1);[...bank.children].forEach(b=>{if(b.dataset.i==obj.i)b.classList.remove('used');});renderAns();};ans.appendChild(t);});
    check.disabled=placed.length!==item.words.length;}
  check.onclick=()=>{const got=placed.map(o=>o.w).join(' '),correct=got===correctStr;
    ans.classList.add(correct?'ok':'bad');check.style.display='none';speak(correctStr);
    advance(correct,(correct?'':`A frase certa é <b>"${correctStr}"</b>. `)+(item.why||''));};
}
function renderMatch(body,item,advance){
  const left=item.pairs.map((p,i)=>({txt:p[0],id:i}));
  const right=item.pairs.map((p,i)=>({txt:p[1],id:i})).sort(()=>Math.random()-0.5);
  body.innerHTML=`<div class="q-prompt">${item.prompt}</div><div class="q-sub">${item.sub||''}</div>
    <div class="match-grid"><div class="match-col" id="L"></div><div class="match-col" id="R"></div></div>`;
  const L=document.getElementById('L'),R=document.getElementById('R');let selLeft=null,matched=0,errors=0;
  function mk(col,obj,side){const b=document.createElement('button');b.className='mtile';b.textContent=obj.txt;b.dataset.id=obj.id;b.onclick=()=>handle(b,obj,side);col.appendChild(b);}
  left.forEach(o=>mk(L,o,'L'));right.forEach(o=>mk(R,o,'R'));
  function handle(btn,obj,side){if(btn.classList.contains('matched'))return;
    if(side==='L'){L.querySelectorAll('.mtile').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');selLeft={btn,obj};speak(obj.txt);}
    else{if(!selLeft)return;if(selLeft.obj.id===obj.id){selLeft.btn.classList.remove('sel');selLeft.btn.classList.add('matched');btn.classList.add('matched');matched++;selLeft=null;
        if(matched===item.pairs.length){const correct=errors===0;advance(correct,correct?'Você ligou todas as duplas!':'Todas ligadas — reveja as que escaparam.');}}
      else{errors++;btn.classList.add('miss');selLeft.btn.classList.remove('sel');selLeft=null;setTimeout(()=>btn.classList.remove('miss'),500);}}}
}

/* ===== TREINO (gerado a partir do vocabulário do capítulo) ===== */
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((m,n)=>m[0]-n[0]).map(x=>x[1]);}
function collectVocab(ch){
  const out=[];
  ch.sections.forEach(s=>{
    if(s.type==='vocab'&&s.groups)s.groups.forEach(g=>g.items.forEach(it=>out.push(it)));
    else if(s.type==='phrases'&&s.data)s.data.forEach(it=>out.push(it));
  });
  const seen=new Set(),res=[];
  out.forEach(it=>{if(it&&it.e&&it.p&&!seen.has(it.e)){seen.add(it.e);res.push(it);}});
  return res;
}
function sayClean(e){return e.split('/')[0].replace(/"/g,'').replace(/\.\.\./g,'').replace(/_+/g,' blank ').trim();}
function buildDrill(ch,count){
  const pool=collectVocab(ch);if(pool.length<4)return[];
  const base=[];
  pool.forEach(it=>{base.push({it,mode:0});base.push({it,mode:1});base.push({it,mode:2});});
  let candidates=[];
  while(candidates.length<count)candidates=[...candidates,...base];
  candidates=shuffle(candidates).slice(0,count);
  return candidates.map(({it,mode})=>{
    const others=shuffle(pool.filter(x=>x.p!==it.p&&x.e!==it.e));
    if(others.length<3)return null;
    if(mode===0){const opts=shuffle([it.p,...others.slice(0,3).map(o=>o.p)]);return{type:'mc',prompt:`O que significa <i>${it.e}</i>?`,opts,answer:opts.indexOf(it.p),why:`<b>${it.e}</b> = ${it.p}.`};}
    else if(mode===1){const opts=shuffle([it.e,...others.slice(0,3).map(o=>o.e)]);return{type:'mc',prompt:`Como se diz <i>${it.p}</i>?`,opts,answer:opts.indexOf(it.e),why:`<b>${it.p}</b> = ${it.e}.`};}
    else{const opts=shuffle([it.p,...others.slice(0,3).map(o=>o.p)]);return{type:'listen',prompt:'Ouça e escolha o significado',sub:'Toque no alto-falante.',audio:sayClean(it.e),opts,answer:opts.indexOf(it.p),why:`<b>${it.e}</b> = ${it.p}.`};}
  }).filter(Boolean);
}
function renderDrill(){
  const ch=COURSE[CUR];const items=buildDrill(ch,50);
  if(!items.length){markSecDone();openChapter(CUR);return;}
  renderFlow({items,title:'Treino',isQuiz:false,onFinish:(sc)=>{
    markSecDone();window.scrollTo(0,0);hideFooter();setBar('Treino',true);setProgressBar(chapPct(CUR));
    app.innerHTML=`<div class="result"><div class="trophy">🔁</div><h1>Bom treino!</h1>
      <p>Você acertou <b>${sc} de ${items.length}</b>. Repetir é o segredo — cada rodada vem com as palavras embaralhadas. Bora de novo!</p></div>`;
    showFooter(`<button class="btn dark" id="again">Treinar de novo 🔀</button><div style="height:10px"></div><button class="btn ghost" id="back">Voltar ao capítulo ${SVG.arrow}</button>`);
    document.getElementById('again').onclick=()=>renderDrill();
    document.getElementById('back').onclick=()=>openChapter(CUR);
  }},0,0);
}

/* ===== PRACTICE / QUIZ ===== */
function renderPractice(idx,score){
  const data=curSec().data;
  renderFlow({items:data,title:"Praticar",isQuiz:false,onFinish:(sc)=>{
    markSecDone();window.scrollTo(0,0);hideFooter();setBar("Praticar",true);setProgressBar(chapPct(CUR));
    app.innerHTML=`<div class="result"><div class="trophy">💪</div><h1>Prática concluída!</h1>
      <p>Você acertou <b>${sc} de ${data.length}</b>. Cada erro é aprendizado — o que importa é seguir.</p></div>`;
    showFooter(`<button class="btn dark" id="again">Praticar de novo</button><div style="height:10px"></div>
                <button class="btn" id="back">Voltar ao capítulo ${SVG.arrow}</button>`);
    document.getElementById('again').onclick=()=>renderPractice(0,0);
    document.getElementById('back').onclick=()=>openChapter(CUR);
  }},idx,score);
}
function renderQuiz(idx,score){
  const c=COURSE[CUR],data=curSec().data;
  renderFlow({items:data,title:"Quiz Final",isQuiz:true,onFinish:(sc)=>{
    const pct=Math.round(sc/data.length*100),pass=pct>=80,pr=P(c.id);
    pr.quizScore=Math.max(pr.quizScore||0,pct);
    if(pass){pr.sections[SEC]=true;pr.complete=true;}save();
    window.scrollTo(0,0);hideFooter();setBar("Quiz Final",true);setProgressBar(chapPct(CUR));
    if(pass)confettiBurst();
    const isFinal=CUR===COURSE.length-1;
    const allDone=COURSE.every(x=>P(x.id).complete);
    let rtitle,rmsg;
    if(!pass){rtitle='Quase lá!';rmsg=`Você acertou <b>${sc} de ${data.length}</b>. Precisa de <b>80%</b> para fechar o capítulo. Revise e tente de novo — você está pertinho!`;}
    else if(isFinal&&allDone){rtitle='Você terminou o A1! 🎉';rmsg=`Todos os <b>12 capítulos</b> concluídos. Você já tem a base: cumprimentar, se apresentar, falar da família e da rotina, pedir comida e se virar no dia a dia. Que orgulho!`;}
    else if(isFinal){rtitle='Capítulo final concluído!';rmsg=`Você fechou o <b>Capítulo ${c.n}</b>! ✓ Falta pouco para completar os 12.`;}
    else{rtitle='Parabéns!';rmsg=`Você concluiu o <b>Capítulo ${c.n}</b>! ✓ Pode seguir para o próximo ou rever o que quiser.`;}
    app.innerHTML=`<div class="result"><div class="trophy">${pass?(isFinal&&allDone?'🎓':'🏆'):'📚'}</div>
      <div class="score ${pass?'pass':''}">${pct}%</div><h1>${rtitle}</h1><p>${rmsg}</p></div>`;
    let btns=`<button class="btn dark" id="retry">Refazer o quiz</button>`;
    if(pass){
      const hasNext=CUR<COURSE.length-1;
      btns=(hasNext?`<button class="btn" id="nextch">Capítulo ${COURSE[CUR+1].n} ${SVG.arrow}</button><div style="height:10px"></div>`:'')+
           `<button class="btn ${hasNext?'ghost':''}" id="home">Voltar ao início ✓</button>`;
    }
    showFooter(btns);
    const r=document.getElementById('retry');if(r)r.onclick=()=>renderQuiz(0,0);
    const h=document.getElementById('home');if(h)h.onclick=()=>goCourse();
    const nc=document.getElementById('nextch');if(nc)nc.onclick=()=>openChapter(CUR+1);
  }},idx,score);
}
function confettiBurst(){const colors=['#E0654A','#1F9A86','#E5A93A','#EF8B5F','#2E9E5B'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.transform=`rotate(${Math.random()*360}deg)`;
    const dur=2.4+Math.random()*1.8;c.style.animation=`fall ${dur}s ${Math.random()*0.6}s linear forwards`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),(dur+1)*1000);}}

/* boot */
goCourse();
</script>
